<style>

    }
  }
  :root[data-theme="dark"]{
    --navy:#F2F2F2; --gray:#9A9A9A; --snow:#242424; --line:#343434;
    --bg:#161616; --card:#1E1E1E; --soft:#262626;
  }

          font-size:12px;font-weight:600;margin-bottom:16px;}

        box-shadow:0 1px 3px rgba(0,0,0,.07);}

         text-transform:uppercase;letter-spacing:.03em;}

  .box-label{font-size:11px;font-weight:600;text-transform:uppercase;
             letter-spacing:.04em;margin-bottom:10px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  label{display:block;font-size:11px;color:var(--gray);margin-bottom:4px;font-weight:500;}
  input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;

  input[type=date]{font-family:Inter,sans-serif;}
  input:focus{outline:2px solid var(--blue);outline-offset:1px;}
  .derived{display:flex;justify-content:space-between;align-items:center;
           padding:11px 13px;background:var(--card);border-radius:10px;margin-top:4px;}
  .derived .lbl{font-size:12px;color:var(--gray);}
  .derived .val{font-family:Oswald,sans-serif;font-size:1.3rem;font-weight:700;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .chip{padding:6px 12px;border-radius:20px;border:1px solid var(--line);
        background:var(--card);color:var(--navy);font-size:12px;cursor:pointer;
        font-family:inherit;font-weight:500;}
  .chip:hover{border-color:var(--blue);}
  .chip.on{background:var(--navy);color:var(--card);border-color:var(--navy);}
  .rule{display:flex;gap:6px;margin-bottom:4px;}
  .rule button{flex:1;padding:10px 8px;border-radius:10px;border:1px solid var(--line);
               background:var(--card);color:var(--navy);font-size:12px;cursor:pointer;
               font-family:inherit;font-weight:500;line-height:1.35;}
  .rule button.on{background:var(--green);color:#fff;border-color:var(--green);font-weight:600;}
  table{width:100%;border-collapse:collapse;}
  th{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.04em;
     font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);}
  td{padding:9px 8px;font-size:13px;border-bottom:1px solid var(--soft);}
  .mono{font-family:'JetBrains Mono',monospace;}
  .r{text-align:right;} .c{text-align:center;}
  tr.tot td{border-top:2px solid var(--line);border-bottom:none;font-weight:700;padding-top:11px;}
  .amount{font-weight:600;}
  .totline{color:var(--green);}
  .empty{font-size:13px;color:var(--gray);text-align:center;padding:20px 0;}
  .note{font-size:11px;color:var(--gray);margin-top:12px;line-height:1.55;}
  .warn{background:rgba(255,183,3,.14);border-left:3px solid var(--gold);
        border-radius:8px;padding:10px 12px;font-size:12px;margin-top:12px;line-height:1.5;}
  details{margin-top:3px;}
  summary{cursor:pointer;font-size:11px;color:var(--blue);padding:3px 0;}
  .days{font-size:11px;color:var(--gray);font-family:'JetBrains Mono',monospace;
        padding:6px 0 2px;line-height:1.7;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:6px;}
  .kpi{background:var(--snow);border-radius:11px;padding:11px;}
  .kpi .k{font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:.04em;}
  .kpi .v{font-family:Oswald,sans-serif;font-size:1.3rem;font-weight:700;margin-top:2px;}
  @media (max-width:520px){ .grid2{grid-template-columns:1fr;} .rule{flex-direction:column;} }
</style>
</head>

  // Dias en que la suma de ocupantes supera el N de entrenadores
  const nAcuerdo=parseInt(String($("nent").value),10)||0;
  const porDia={}; recs.forEach(r=>{porDia[r.d]=(porDia[r.d]||0)+r.n;});
  const excedidos=Object.keys(porDia).filter(d=>porDia[d]>nAcuerdo).sort();

  return {filas,totDias,totPersonas,totPag,totMonto,vpp,excedidos,porDia,nAcuerdo,
          diasDistintos:new Set(recs.map(r=>r.d)).size};
}

function render(){
  $("porPersona").textContent = valorPorPersona()>0 ? pesos(valorPorPersona()) : "\u2014";
  $("r-todos").classList.toggle("on", regla==="todos");
  $("r-pasaj").classList.toggle("on", regla==="pasajeros");

  const st=calcular();
  let h="";

  if(!st.filas.length){
    h = '<div class="empty">No hay registros de transporte en ese per\u00edodo.</div>';
    $("out").innerHTML=h; return;
  }

  h += '<div class="kpis">'
    + '<div class="kpi"><div class="k">D\u00edas con registro</div><div class="v">'+st.diasDistintos+'</div></div>'
    + '<div class="kpi"><div class="k">Viajes</div><div class="v">'+st.totDias+'</div></div>'
    + '<div class="kpi"><div class="k">Personas</div><div class="v">'+st.totPersonas+'</div></div>'
    + '<div class="kpi"><div class="k">Total a pagar</div><div class="v" style="color:var(--green);">'+pesos(st.totMonto)+'</div></div>'
    + '</div>';

  h += '<div style="overflow-x:auto;margin-top:14px;"><table><thead><tr>'
    + '<th style="text-align:left;">Due\u00f1o del auto</th>'
    + '<th class="c">D\u00edas</th><th class="c">Personas</th>'
    + '<th class="c">Se pagan</th><th class="r">Monto</th>'
    + '</tr></thead><tbody>';

  st.filas.forEach(f=>{
    h += '<tr><td>'+f.code
      + '<details><summary>ver los '+f.dias+' d\u00edas</summary><div class="days">'
      + f.detalle.sort((a,b)=>a.d<b.d?-1:1)
          .map(x=>fechaCorta(x.d)+' \u00b7 '+x.n+'p'+(x.p!==x.n?' \u2192 '+x.p:''))
          .join('<br>')
      + '</div></details></td>'
      + '<td class="mono c">'+f.dias+'</td>'
      + '<td class="mono c" style="color:var(--gray);">'+f.personas+'</td>'
      + '<td class="mono c">'+f.pag+'</td>'
      + '<td class="mono r amount">'+pesos(f.monto)+'</td></tr>';
  });
  h += '<tr class="tot"><td>Total</td>'
    + '<td class="mono c">'+st.totDias+'</td>'
    + '<td class="mono c">'+st.totPersonas+'</td>'
    + '<td class="mono c">'+st.totPag+'</td>'
    + '<td class="mono r totline">'+pesos(st.totMonto)+'</td></tr>';
  h += '</tbody></table></div>';

  if(st.nAcuerdo>0 && st.excedidos.length){
    h += '<div class="warn"><b>'+st.excedidos.length+' d\u00eda'+(st.excedidos.length===1?'':'s')
      + '</b> con m\u00e1s de '+st.nAcuerdo+' ocupantes en total, as\u00ed que ese d\u00eda el pago supera el total diario: '
      + st.excedidos.map(d=>fechaCorta(d)+' ('+st.porDia[d]+')').join(' \u00b7 ') + '</div>';
  }

  const solos = st.filas.reduce((s,f)=>s+f.detalle.filter(x=>x.n===1).length,0);
  if(solos && regla==="todos"){
    h += '<div class="warn">'+solos+' de los '+st.totDias
      + ' viajes son en solitario (el due\u00f1o iba solo). Con esta regla igual se pagan; con "solo los pasajeros" quedan en cero.</div>';
  }

  h += '<div class="note">El valor por persona sale de dividir el total por d\u00eda entre el n\u00famero de entrenadores. '
    + 'Cada due\u00f1o recibe ese valor por cada ocupante que se cuenta. '
    + '"D\u00edas" son los d\u00edas en que puso su auto; la columna "Personas" es la suma de ocupantes registrados y '
    + '"Se pagan" es lo que queda tras aplicar la regla de arriba.</div>';

  $("out").innerHTML=h;
}

// Atajos de periodo
function setRango(d,h){ $("desde").value=d; $("hasta").value=h; render(); marcarChip(); }
function marcarChip(){
  document.querySelectorAll("#chips .chip").forEach(b=>{
    b.classList.toggle("on", b.dataset.d===$("desde").value && b.dataset.h===$("hasta").value);
  });
}
(function(){
  const chips=[{t:"Todo",d:MIN,h:MAX}];
  mesesSet.forEach(m=>{
    const [y,mm]=m.split("-").map(Number);
    const ult=new Date(y,mm,0).getDate();
    chips.push({t:nombreMes(m).split(" ")[0], d:m+"-01", h:m+"-"+String(ult).padStart(2,"0")});
  });
  $("chips").innerHTML=chips.map(c=>
    '<button class="chip" data-d="'+c.d+'" data-h="'+c.h+'">'+c.t+'</button>').join("");
  document.querySelectorAll("#chips .chip").forEach(b=>
    b.addEventListener("click",()=>setRango(b.dataset.d,b.dataset.h)));
})();

["total","nent","desde","hasta"].forEach(id=>
  $(id).addEventListener("input",()=>{render();marcarChip();}));
$("r-todos").addEventListener("click",()=>{regla="todos";render();});
$("r-pasaj").addEventListener("click",()=>{regla="pasajeros";render();});

$("desde").value=MIN; $("hasta").value=MAX;
render(); marcarChip();
</script>
</body>
</html>

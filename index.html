<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CEC 26 - Asistencia de Entrenadores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1A1A1A; --red:#BC1A25; --blue:#3E92CC; --snow:#F7F7F7;
    --gray:#8D8D8D; --gold:#FFB703; --green:#2E8B57; --border:#DDDDDD;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--snow); font-family:'Inter',sans-serif; color:#3A4658;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  .hero{background:var(--navy); padding:20px 20px 24px; position:relative; overflow:hidden;}
  .eyebrow{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.2em; font-size:12px; color:var(--gold); margin-bottom:4px;}
  .hero-title{font-family:'Oswald',sans-serif; font-weight:700; color:white; font-size:1.7rem; line-height:1.1;}
  .hero-sub{color:#D9D9D9; font-size:13px; margin-top:2px;}

  .wrap{max-width:900px; margin:0 auto; padding:20px 16px 40px;}
  .card{background:white; border-radius:16px; padding:20px; box-shadow:0 10px 30px rgba(11,37,69,.10); margin-bottom:16px;}

  .season-header{
    display:flex; align-items:center; gap:12px; margin:24px 0 16px 0;
    padding-bottom:12px; border-bottom:2px solid #E7ECF2;
  }
  .season-header.preseason{border-bottom-color:var(--blue);}
  .season-header.temporada{border-bottom-color:var(--red);}
  
  .season-badge{
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.08em;
    font-size:13px; font-weight:600; padding:6px 12px; border-radius:8px;
  }
  .season-badge.preseason{background:var(--blue); color:white;}
  .season-badge.temporada{background:var(--red); color:white;}

  .season-title{
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.08em;
    font-size:16px; font-weight:600; color:var(--navy);
  }

  .trainer-card{
    background:#F7FAFC; border:1px solid #E7ECF2; border-radius:12px; 
    padding:16px; margin-bottom:12px; overflow:hidden;
  }
  .trainer-header{
    display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px;
  }
  .trainer-name{
    font-size:15px; font-weight:600; color:var(--navy);
  }
  .trainer-code{
    font-size:12px; background:#E7ECF2; color:var(--gray); 
    padding:4px 8px; border-radius:6px;
  }

  .calendar-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(50px, 1fr)); 
    gap:6px; margin-bottom:12px;
  }
  .cal-day{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    border:1px solid #E7ECF2; border-radius:8px; cursor:pointer; 
    font-size:12px; font-weight:500; background:white;
    transition:all 0.2s ease;
  }
  .cal-day:hover{border-color:var(--blue);}
  .cal-day.present{background:var(--green); color:white; border-color:var(--green);}
  .cal-day.absent{background:var(--red); color:white; border-color:var(--red);}
  .cal-day.libre{background:var(--gold); color:var(--navy); border-color:var(--gold);}
  .cal-day.empty{background:transparent; border:none; cursor:default;}

  .day-label{font-size:11px; color:var(--gray); text-align:center; margin-bottom:4px; font-weight:500;}
  .day-label.weekend{color:var(--red);}

  .legend{
    display:flex; flex-wrap:wrap; gap:12px; padding:12px; 
    background:#F7FAFC; border-radius:8px; margin-top:12px; font-size:12px;
  }
  .legend-item{display:flex; align-items:center; gap:6px;}
  .legend-color{width:16px; height:16px; border-radius:4px; border:1px solid #E7ECF2;}
  .legend-color.presente{background:var(--green);}
  .legend-color.ausente{background:var(--red);}
  .legend-color.libre{background:var(--gold);}

  .action-buttons{
    display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;
  }
  .btn{
    padding:9px 14px; border-radius:8px; border:1px solid var(--border);
    background:white; color:var(--navy); font-size:12px; font-weight:500;
    cursor:pointer; transition:all 0.2s ease;
  }
  .btn:hover{background:#F7FAFC; border-color:var(--blue);}
  .btn.primary{background:var(--red); color:white; border-color:var(--red);}
  .btn.primary:hover{background:#9d151d;}

  .tabs{display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;}
  .tab-btn{
    padding:10px 16px; border-radius:8px; border:1px solid #E7ECF2;
    background:white; color:var(--navy); font-size:13px; font-weight:500;
    cursor:pointer; transition:all 0.2s ease;
  }
  .tab-btn.active{background:var(--navy); color:white; border-color:var(--navy);}

  .summary-box{
    background:var(--navy); color:white; border-radius:12px; padding:16px;
    margin-bottom:16px; display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:12px;
  }
  .summary-item{text-align:center;}
  .summary-label{font-size:12px; color:#D9D9D9; margin-bottom:4px;}
  .summary-value{font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:700; color:var(--gold);}

  .info-box{
    font-size:12px; background:#EEF3FA; color:var(--navy); border-radius:8px; 
    padding:12px; margin-bottom:12px; border-left:3px solid var(--blue);
  }

  @media (max-width:480px){
    .hero-title{font-size:1.2rem;}
    .calendar-grid{grid-template-columns:repeat(auto-fill, minmax(40px, 1fr));}
    .cal-day{font-size:10px;}
  }
</style>
</head>
<body>

<div class="hero">
  <div class="eyebrow">Sistema de Gestión</div>
  <div class="hero-title">Asistencia de Entrenadores</div>
  <div class="hero-sub">Calendario dividido por temporadas • Gestión de días libres</div>
</div>

<div class="wrap">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('calendar')">📅 Calendario</button>
    <button class="tab-btn" onclick="switchTab('resumen')">📊 Resumen</button>
  </div>

  <div id="tab-calendar">
    <div class="info-box">
      💡 Haz clic en los días para cambiar el estado: Presente (verde) → Ausente (rojo) → Día Libre (amarillo) → Sin marcar
    </div>

    <div id="preseason-section"></div>
    <div id="temporada-section"></div>
  </div>

  <div id="tab-resumen" style="display:none;">
    <div id="summary-content"></div>
  </div>
</div>

<script>
const MONTHS = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", 
                "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
const DAYS = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];

let trainers = [];
let attendance = {}; // {trainerId: {date: 'present'|'absent'|'libre'}}
let currentTab = 'calendar';

// Datos de ejemplo
const TRAINER_DATA = [
  {id: 1, name: "Juan García", code: "T001"},
  {id: 2, name: "María López", code: "T002"},
  {id: 3, name: "Carlos Díaz", code: "T003"},
  {id: 4, name: "Ana Martínez", code: "T004"},
];

function initData(){
  trainers = TRAINER_DATA;
  trainers.forEach(t => {
    attendance[t.id] = {};
  });
}

function getMonthDays(month, year){
  return new Date(year, month + 1, 0).getDate();
}

function getFirstDay(month, year){
  return new Date(year, month, 1).getDay();
}

function getDaysInRange(startDay, endDay, month, year){
  const days = [];
  for(let d = startDay; d <= endDay; d++){
    days.push({day: d, month, year});
  }
  return days;
}

function isWeekend(day, month, year){
  const date = new Date(year, month, day);
  return date.getDay() === 0 || date.getDay() === 6;
}

function formatDate(day, month, year){
  const date = new Date(year, month, day);
  return date.toISOString().split('T')[0];
}

function toggleAttendance(trainerId, day, month, year){
  const dateStr = formatDate(day, month, year);
  const current = attendance[trainerId][dateStr];
  
  let next;
  if(!current) next = 'present';
  else if(current === 'present') next = 'absent';
  else if(current === 'absent') next = 'libre';
  else next = undefined;
  
  if(next){
    attendance[trainerId][dateStr] = next;
  } else {
    delete attendance[trainerId][dateStr];
  }
  
  render();
}

function renderCalendar(section, title, startDay, endDay, season){
  let html = `
    <div class="season-header ${season}">
      <div class="season-badge ${season}">${season === 'preseason' ? 'Pre Temporada' : 'Temporada 26'}</div>
      <div class="season-title">${title}</div>
    </div>
  `;
  
  trainers.forEach(trainer => {
    html += `
      <div class="trainer-card">
        <div class="trainer-header">
          <div class="trainer-name">${trainer.name}</div>
          <div class="trainer-code">${trainer.code}</div>
        </div>
        <div class="calendar-grid">
    `;
    
    // Días del mes
    for(let d = startDay; d <= endDay; d++){
      const dateStr = formatDate(d, 0, 2026); // Enero 2026
      const status = attendance[trainer.id][dateStr];
      const isWknd = isWeekend(d, 0, 2026);
      const statusClass = status ? status : '';
      
      html += `
        <div>
          <div class="day-label ${isWknd ? 'weekend' : ''}">${d}</div>
          <div class="cal-day ${statusClass}" onclick="toggleAttendance(${trainer.id}, ${d}, 0, 2026)">
            ${status ? (status === 'present' ? '✓' : status === 'absent' ? '✗' : 'L') : ''}
          </div>
        </div>
      `;
    }
    
    html += `
        </div>
        <div class="legend">
          <div class="legend-item">
            <div class="legend-color presente"></div>
            <span>Presente</span>
          </div>
          <div class="legend-item">
            <div class="legend-color ausente"></div>
            <span>Ausente</span>
          </div>
          <div class="legend-item">
            <div class="legend-color libre"></div>
            <span>Día Libre</span>
          </div>
        </div>
      </div>
    `;
  });
  
  document.getElementById(section).innerHTML = html;
}

function renderSummary(){
  let html = '';
  
  trainers.forEach(trainer => {
    const dates = Object.keys(attendance[trainer.id]);
    const presentes = dates.filter(d => attendance[trainer.id][d] === 'present').length;
    const ausentes = dates.filter(d => attendance[trainer.id][d] === 'absent').length;
    const libres = dates.filter(d => attendance[trainer.id][d] === 'libre').length;
    
    html += `
      <div class="card">
        <h3>${trainer.name} (${trainer.code})</h3>
        <div class="summary-box">
          <div class="summary-item">
            <div class="summary-label">Presentes</div>
            <div class="summary-value" style="color:var(--green);">${presentes}</div>
          </div>
          <div class="summary-item">
            <div class="summary-label">Ausentes</div>
            <div class="summary-value" style="color:var(--red);">${ausentes}</div>
          </div>
          <div class="summary-item">
            <div class="summary-label">Días Libres</div>
            <div class="summary-value" style="color:var(--gold);">${libres}</div>
          </div>
        </div>
      </div>
    `;
  });
  
  document.getElementById('summary-content').innerHTML = html;
}

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  
  document.getElementById('tab-calendar').style.display = tab === 'calendar' ? 'block' : 'none';
  document.getElementById('tab-resumen').style.display = tab === 'resumen' ? 'block' : 'none';
  
  if(tab === 'resumen') renderSummary();
}

function render(){
  // Pre temporada: del 1 al 18
  renderCalendar('preseason-section', 'Enero 1 - 18', 1, 18, 'preseason');
  
  // Temporada 26: del 19 en adelante
  renderCalendar('temporada-section', 'Enero 19 - 31', 19, 31, 'temporada');
}

// Inicializar
initData();
render();
</script>

</body>
</html>

function renderSetupTab(){
  let html = `<div class="card">
    <div class="section-label"><div class="gate-poles"><span></span><span></span></div><span class="title">Grupos e integrantes</span></div>
    <div style="font-size:12px;color:${GRAY};margin-bottom:16px;">Se registran una sola vez. Luego, en "Registro diario" solo eliges la fecha.</div>`;

  if(authState.level === "master"){
    html += `<div class="pills" style="margin-bottom:6px;">`;
    PROGRAM_CATEGORIES[currentProgram].forEach(c => {
      const g = groups.find(gr => gr.program === currentProgram && gr.name === c);
      const isSelected = g && g.id === selectedGroupId;
      const isCreated = !!g;
      html += `<button type="button" class="cat-btn${isCreated?" created":""}${isSelected?" selected":""}" data-cat="${c}">
        👥 ${c}
      </button>`;
    });
    html += `</div><div style="font-size:12px;color:${GRAY};margin-bottom:16px;">Toca una categoría para activarla.</div>`;
  } else {
    html += `<div class="cat-fixed" style="margin-bottom:16px;">👥 ${authState.program} · ${authState.category}</div>`;
  }

  if(selectedGroupId){
    html += `<div style="display:flex;gap:8px;margin-bottom:14px;">
      <input type="text" id="new-athlete-name" placeholder="Nombre del integrante" style="flex:1;" />
      <button class="btn-navy" id="add-athlete-btn" style="background:${RED};">➕</button>
    </div>`;

    const list = groupAthletes();
    if(!list.length){
      html += `<div style="font-size:13px;color:${GRAY};text-align:center;padding:16px 0;">Aún no hay integrantes en esta categoría.</div>`;
    } else {
      list.forEach(a => {
        const isOpen = expandedAthleteId === a.id;
        html += `<div class="athlete-card">
          <div class="athlete-row">
            <span class="athlete-name">${escapeHtml(a.name)}</span>
            ${a.phone ? `<span class="phone-badge">📞 ${escapeHtml(a.phone)}</span>` : ""}
            <button class="ficha-btn${isOpen?" open":""}" data-toggle-ficha="${a.id}">🩺 Ficha ${isOpen?"▲":"▼"}</button>${(a.notas||"").trim()?`<span class="nota-chip" title="${escapeHtml(a.notas)}">📝 nota</span>`:""}
            <span style="cursor:pointer;color:${GRAY};" data-remove-athlete="${a.id}">🗑️</span>
          </div>`;
        if(isOpen){
          html += `<div class="ficha-body">
            <label class="field-label" style="margin-top:8px;">Teléfono de contacto</label>
            <input type="text" id="ficha-phone" value="${escapeHtml(fichaDraft.phone)}" placeholder="Ej. +56 9 1234 5678" style="margin-bottom:10px;" />
            <div style="font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:11px;color:${NAVY};letter-spacing:.05em;margin-bottom:6px;">Ficha médica</div>
            <label class="field-label">Enfermedades relevantes</label>
            <input type="text" id="ficha-enfermedades" value="${escapeHtml(fichaDraft.enfermedades)}" placeholder="Ej. Asma, diabetes tipo 1..." style="margin-bottom:10px;" />
            <label class="field-label">Alergias</label>
            <input type="text" id="ficha-alergias" value="${escapeHtml(fichaDraft.alergias)}" placeholder="Ej. Alergia a frutos secos..." style="margin-bottom:10px;" />
            <label class="field-label">Medicamentos permanentes</label>
            <input type="text" id="ficha-medicamentos" value="${escapeHtml(fichaDraft.medicamentos)}" placeholder="Ej. Salbutamol inhalador..." style="margin-bottom:10px;" />
            <label class="field-label">Otros</label>
            <textarea id="ficha-otros" rows="2" placeholder="Cualquier otro dato relevante para su seguridad...">${escapeHtml(fichaDraft.otros)}</textarea>
            <button class="btn-navy" id="save-ficha-btn" data-athlete="${a.id}" style="width:100%;justify-content:center;margin-top:10px;">✓ Guardar ficha</button>
            <div style="border-top:1px solid #E7ECF2;margin-top:14px;padding-top:12px;">
              ${athleteNotaFieldHTML(a)}
              <div style="font-size:11px;color:${GRAY};margin-top:4px;">Se guarda solo al salir del campo. Separado de la ficha médica.</div>
            </div>
          </div>`;
        }
        html += `</div>`;
      });
    }
  }

  html += `</div>`;
  return html;
}

function renderDailyTab(){
  if(!selectedGroupId){
    return `<div class="card" style="text-align:center;color:${GRAY};font-size:13px;">Crea un grupo primero en la pestaña "Grupos".</div>`;
  }
  const gAthletes = groupAthletes();
  const program = programOf(selectedGroupId);
  const cfg = configForGroup(selectedGroupId);
  let html = `<div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">`;

  if(authState.level === "master"){
    html += `<select id="daily-group-select">${groupsSortedByCategory().map(g => `<option value="${g.id}" ${g.id===selectedGroupId?"selected":""}>${g.program} · ${escapeHtml(g.name)}</option>`).join("")}</select>`;
  } else {
    html += `<div class="cat-fixed">${authState.program} · ${authState.category}</div>`;
  }
  html += `</div></div>`;
  html += calendarCardHTML();

  html += `<div class="card">`;
  html += `<div class="section-label"><div class="gate-poles"><span></span><span></span></div><span class="title">Asistencia del día</span></div>`;
  if(!gAthletes.length){
    html += `<div style="font-size:13px;color:${GRAY};text-align:center;padding:12px 0;">Agrega integrantes a este grupo en la pestaña "Grupos".</div>`;
  } else {
    gAthletes.forEach(a => {
      const present = attendanceState[a.id];
      html += `<div style="display:flex;align-items:center;gap:8px;padding:10px;border-radius:8px;background:#F7FAFC;margin-bottom:8px;">
        <span style="flex:1;font-size:14px;font-weight:500;color:${NAVY};">${escapeHtml(a.name)}</span>
        <button class="pill" data-att="${a.id}" data-present="true" style="${present?`background:${GREEN};color:white;border-color:${GREEN};`:""}padding:6px 10px;font-size:12px;">✓ Presente</button>
        <button class="pill" data-att="${a.id}" data-present="false" style="${!present?`background:${RED};color:white;border-color:${RED};`:""}padding:6px 10px;font-size:12px;">✕ Ausente</button>
      </div>`;
    });
  }
  html += `</div>`;

  if(gAthletes.length){
    const nadieVino = gAthletes.every(a => !attendanceState[a.id]);
    html += `<div class="card" style="${nadieVino ? `opacity:0.6;background:#F5F5F5;` : ""}">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;row-gap:8px;margin-bottom:12px;">
        <div class="section-label" style="margin:0;"><div class="gate-poles"><span></span><span></span></div><span class="title">Sesiones de entrenamiento${nadieVino ? ` · <span style="font-weight:normal;opacity:0.7;font-size:12px;">(opcional)</span>` : ""}</span></div>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
          <button class="stepper button" id="dec-session-btn" style="border:1px solid var(--border);border-radius:8px;width:28px;height:28px;flex-shrink:0;">−</button>
          <span style="font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:${NAVY};">${sessionCount}</span>
          <button class="stepper button" id="inc-session-btn" style="border:1px solid var(--border);border-radius:8px;width:28px;height:28px;flex-shrink:0;">+</button>
        </div>
      </div>`;

    for(let i=1;i<=sessionCount;i++){
      const s = sessionState[i] || blankSessionForm();
      const total = (s.curvasPorBajada||0) * (s.bajadas||0);
      html += `<div class="session-card" data-session-card="${i}">
        <div style="font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;color:${NAVY};margin-bottom:10px;">Sesión ${i}</div>

        ${cfg.disciplinas.length ? `
        <div style="font-size:12px;color:${GRAY};margin-bottom:6px;">Disciplina</div>
        <div class="pills" data-session="${i}" data-pillgroup="disciplina" style="margin-bottom:12px;">${pillsHTML(cfg.disciplinas, "disciplina", s.disciplina)}</div>` : ""}

        <div style="font-size:12px;color:${GRAY};margin-bottom:6px;">Tipo de nieve</div>
        <div class="pills" data-session="${i}" data-pillgroup="nieve" style="margin-bottom:12px;">${pillsHTML(NIEVE, "nieve", s.nieve)}</div>

        <div style="font-size:12px;color:${GRAY};margin-bottom:6px;">Clima</div>
        <div class="pills" data-session="${i}" data-pillgroup="clima" style="margin-bottom:12px;">${pillsHTML(CLIMA, "clima", s.clima)}</div>

        <div style="font-size:12px;color:${GRAY};margin-bottom:6px;">Trabajo realizado</div>
        <div class="pills" data-session="${i}" data-pillgroup="trabajo" style="margin-bottom:12px;">${pillsHTML(cfg.trabajo, "trabajo", s.trabajo)}</div>

        ${s.trabajo === "Ejercicios educativos" ? `
          <div class="fund-box">
            <div style="font-size:12px;font-weight:600;color:#B87700;margin-bottom:8px;">Fundamentos trabajados (elige uno o más)</div>
            <div class="pills" data-session="${i}" data-pillgroup="fundamentos">${fundamentosPillsHTML(s.fundamentos)}</div>
          </div>` : ""}

        <div class="steppers">
          ${cfg.hasCurvas ? `
          <div class="stepper">
            <div class="lbl">Curvas por bajada</div>
            <div class="box">
              <button data-session="${i}" data-target="curvasPorBajada" data-delta="-1">−</button>
              <input type="text" inputmode="numeric" class="num-input" data-session="${i}" data-target="curvasPorBajada" value="${s.curvasPorBajada||0}" />
              <button data-session="${i}" data-target="curvasPorBajada" data-delta="1">+</button>
            </div>
          </div>` : ""}
          <div class="stepper">
            <div class="lbl">Cantidad de bajadas</div>
            <div class="box">
              <button data-session="${i}" data-target="bajadas" data-delta="-1">−</button>
              <input type="text" inputmode="numeric" class="num-input" data-session="${i}" data-target="bajadas" value="${s.bajadas||0}" />
              <button data-session="${i}" data-target="bajadas" data-delta="1">+</button>
            </div>
          </div>
        </div>
        ${cfg.hasCurvas ? `<div class="total-box"><span class="lbl">Total de curvas</span><span class="val" id="total-${i}">${total}</span></div>` : ""}

        <textarea class="notas-input" data-session="${i}" rows="2" placeholder="Observaciones de la sesión...">${escapeHtml(s.notas)}</textarea>

        ${hasTrazado(program, categoryOf(selectedGroupId)) ? `
        <div style="font-size:12px;color:${GRAY};margin:12px 0 6px;">Trazado (dibuja el esquema)</div>
        <div class="trazado-box">
          <canvas class="trazado-canvas" data-session="${i}" width="600" height="360"></canvas>
        </div>
        <div style="display:flex;gap:8px;margin-top:8px;">
          <button type="button" class="btn-outline trazado-clear" data-session="${i}" style="flex:1;justify-content:center;">Borrar</button>
          <button type="button" class="trazado-color" data-session="${i}" data-color="#1A1A1A" style="width:36px;border-radius:8px;border:2px solid #1A1A1A;background:#1A1A1A;"></button>
          <button type="button" class="trazado-color" data-session="${i}" data-color="#BC1A25" style="width:36px;border-radius:8px;border:2px solid #DDDDDD;background:#BC1A25;"></button>
        </div>` : ""}
      </div>`;
    }

    if(saveDayError) html += `<div class="error-box">${escapeHtml(saveDayError)}</div>`;
    const hasDayMenuOptions = justSaved || dayHasSavedData();
    const delGrupoUI = groupAthletes();
    if(delGrupoUI.length && delGrupoUI.every(a => !attendanceState[a.id])){
      html += `<div class="info-box" style="margin-bottom:10px;background:#E3F2FD;border-left-color:#3E92CC;"><strong>✓ Todos ausentes:</strong> puedes guardar sin completar los detalles de sesión. Solo se registrará la asistencia.</div>`;
    }
    html += `<div style="display:flex;gap:8px;align-items:stretch;">
      <button class="save-btn" id="save-day-btn" style="flex:1;">${saving? "Guardando...":"✓ Guardar día"}</button>`;
    if(hasDayMenuOptions){
      html += `<div class="menu-wrap">
        <button class="save-btn" id="day-menu-btn" aria-label="Más acciones del día" style="width:48px;flex:none;padding:0;">⋯</button>
        ${dayMenuOpen ? `<div class="header-menu" style="right:0;left:auto;">
          ${justSaved ? `<button id="share-whatsapp-btn">📲 Compartir a WhatsApp</button>` : ""}
          ${dayHasSavedData() ? `<button id="delete-day-btn">🗑️ Borrar registro del día</button>` : ""}
        </div>` : ""}
      </div>`;
    }
    html += `</div>`;
    html += `</div>`;

    html += `<div class="card">
      <div class="backup-row">
        <button class="btn-navy" id="export-excel-btn" style="flex:1;">⬇️ Descargar Excel</button>
        <button class="btn-outline" id="copy-summary-btn" style="flex:1;">📋 Copiar resumen</button>
      </div>
    </div>`;
  }

  return html;
}

function renderProfileTab(){
  let html = `<div class="card">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">`;
  if(authState.level === "master"){
    html += `<select id="profile-group-select">${groupsSortedByCategory().map(g => `<option value="${g.id}" ${g.id===selectedGroupId?"selected":""}>${g.program} · ${escapeHtml(g.name)}</option>`).join("")}</select>`;
  }
  const gAthletes = groupAthletes();
  html += `<select id="profile-athlete-select">${gAthletes.map(a => `<option value="${a.id}" ${a.id===profileAthleteId?"selected":""}>${escapeHtml(a.name)}</option>`).join("")}</select>`;
  html += `</div>`;

  const profileAthlete = athletes.find(a => a.id === profileAthleteId);
  if(!profileAthlete){
    html += `<div style="text-align:center;font-size:13px;color:${GRAY};padding:24px 0;">Agrega integrantes a este grupo para ver su perfil.</div></div>`;
    return html;
  }

  const st = athleteStats(profileAthleteId, selectedGroupId);
  const m = profileAthlete.medical || blankFicha();

  html += `<div style="background:#F7FAFC;border:1px solid #E7ECF2;border-radius:12px;padding:14px;margin-bottom:16px;">
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;">
      <span style="font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:11px;color:${NAVY};letter-spacing:.05em;">🩺 Ficha del integrante</span>
    </div>
    <div style="font-size:13px;margin-bottom:6px;">📞 ${profileAthlete.phone ? escapeHtml(profileAthlete.phone) : `<span style="color:${GRAY};">Sin teléfono registrado</span>`}</div>
    <div style="font-size:12px;display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;">
      <div><b>Enfermedades:</b> ${escapeHtml(m.enfermedades)||"—"}</div>
      <div><b>Alergias:</b> ${escapeHtml(m.alergias)||"—"}</div>
      <div><b>Medicamentos:</b> ${escapeHtml(m.medicamentos)||"—"}</div>
      <div><b>Otros:</b> ${escapeHtml(m.otros)||"—"}</div>
    </div>
    <div style="font-size:11px;color:${GRAY};margin-top:8px;">Para editar los datos médicos, ve a la pestaña "Grupos".</div>
  </div>`;

  html += `<div class="obs-box">
    ${athleteNotaFieldHTML(profileAthlete)}
  </div>`;

  const pistas = athletePeriodStats(profileAthleteId, "temporada_26");
  const pre    = athletePeriodStats(profileAthleteId, "pre_temporada");
  const cfg = configForGroup(selectedGroupId);
  html += `<div class="stat-row">
    <div class="stat-box" style="background:#EAF7EE;"><div class="stat-val" style="color:${GREEN};">${pistas.pct===null?"—":pistas.pct+"%"}</div><div class="stat-lbl">Asistencia en pistas${pistas.pct===null?"":` (${pistas.present}/${pistas.total})`}</div></div>
    <div class="stat-box" style="background:#EEF3FA;"><div class="stat-val" style="color:${NAVY};">${st.diasAsistidos}</div><div class="stat-lbl">Días entrenados${st.totalSesiones!==st.diasAsistidos?` <span style="color:${GRAY};">(${st.totalSesiones} sesiones)</span>`:""}</div></div>
    ${cfg.hasCurvas ? `<div class="stat-box" style="background:#FFF6E0;"><div class="stat-val" style="color:#B87700;">${st.totalCurvas}</div><div class="stat-lbl">Curvas totales a la fecha</div></div>` : ""}
  </div>`;

  html += `<div class="card panel inner" style="margin-bottom:16px;">
    <button type="button" class="panel-toggle" id="pre-atleta-toggle">
      <span class="panel-title">Pre temporada · 30 jun al 17 jul</span>
      <span class="panel-meta">${pre.pct===null?"sin registros":pre.pct+"%"} <span class="chev">${preAtletaPanelOpen?"▴":"▾"}</span></span>
    </button>
    ${preAtletaPanelOpen ? `<div class="panel-body">
      ${pre.pct===null
        ? `<div style="font-size:12px;color:${GRAY};">Este integrante no tiene registros de pretemporada.</div>`
        : `<div class="pctbar-row" style="margin:0;">
             <div class="pctbar-top"><span>Asistencia</span><span style="font-family:'JetBrains Mono',monospace;font-weight:600;color:${NAVY};">${pre.pct}% (${pre.present}/${pre.total})</span></div>
             <div class="pctbar-track"><div class="pctbar-fill" style="width:${pre.pct}%;background:${GOLD};"></div></div>
             ${pre.excl?`<div class="pct-excluidos">${pre.excl} día${pre.excl===1?"":"s"} sin entrenamiento, no cuentan</div>`:""}
           </div>
           <div style="font-size:11px;color:${GRAY};margin-top:8px;">No afecta el porcentaje en pistas.</div>`}
    </div>` : ""}
  </div>`;

  if(cfg.disciplinas.length) html += variableBlockHTML("Disciplina", st.disciplina, () => NAVY);
  html += variableBlockHTML("Tipo de nieve", st.nieve, () => BLUE);
  html += variableBlockHTML("Clima", st.clima, () => GOLD);
  html += variableBlockHTML("Trabajo realizado", st.trabajo, (name) => (configForGroup(selectedGroupId).trabajo.find(t=>t.label===name)||{}).color || NAVY);

  if(st.educativasCount > 0){
    html += variableBlockHTML("Fundamentos (en ejercicios educativos)", st.fundamentos, () => GOLD);
    html += `<div style="font-size:11px;color:${GRAY};margin-bottom:10px;">% de las ${st.educativasCount} sesiones de ejercicios educativos en que se trabajó cada fundamento (pueden sumar más de 100%).</div>`;
  }

  html += `<div style="font-size:11px;color:${GRAY};">Los porcentajes se calculan solo con los días en que este integrante estuvo presente.</div>`;
  html += `</div>`;

  // ===== Asistencia del grupo (días en pista: solo temporada, sin pretemporada) =====
  const grpSummary = getGroupSummary(selectedGroupId, "temporada_26");
  const grpAthStats = getGroupAthleteStats(selectedGroupId, "temporada_26");
  const grpIndAvg = getGroupIndividualAverage(grpAthStats);
  const grpPct = grpSummary.attendance.countable > 0 ? grpSummary.attendance.percent : null;

  html += `<div class="card">
    <div class="section-label"><div class="gate-poles"><span></span><span></span></div><span class="title">Asistencia del grupo</span></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px;">
      <div style="background:${SNOW};border-radius:12px;padding:12px;">
        <div style="font-size:11px;color:${GRAY};text-transform:uppercase;letter-spacing:.04em;">Días en pista</div>
        <div style="font-family:'Oswald',sans-serif;font-size:1.5rem;font-weight:700;color:${NAVY};">${grpSummary.trainingDays}</div>
      </div>
      <div style="background:${SNOW};border-radius:12px;padding:12px;">
        <div style="font-size:11px;color:${GRAY};text-transform:uppercase;letter-spacing:.04em;">Asistencia del grupo</div>
        <div style="font-family:'Oswald',sans-serif;font-size:1.5rem;font-weight:700;color:${grpPct === null ? GRAY : GREEN};">${grpPct === null ? "—" : grpPct + "%"}</div>
      </div>
      <div style="background:${SNOW};border-radius:12px;padding:12px;">
        <div style="font-size:11px;color:${GRAY};text-transform:uppercase;letter-spacing:.04em;">Promedio individual</div>
        <div style="font-family:'Oswald',sans-serif;font-size:1.5rem;font-weight:700;color:${grpIndAvg === null ? GRAY : GREEN};">${grpIndAvg === null ? "—" : grpIndAvg + "%"}</div>
      </div>
    </div>
    ${grpAthStats.length ? `<div style="font-size:11px;color:${NAVY};font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;">Asistencia por integrante</div>
    ${grpAthStats.map(a => `<div style="margin-bottom:8px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">
        <span style="font-size:12px;color:${NAVY};">${escapeHtml(a.name)}</span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:${GRAY};">${a.present}/${a.total} · <b style="color:${a.percent >= 80 ? GREEN : a.percent >= 50 ? "#B87700" : RED};">${a.percent}%</b></span>
      </div>
      <div style="height:6px;background:#E7ECF2;border-radius:3px;overflow:hidden;">
        <div style="height:100%;width:${a.percent}%;background:${a.percent >= 80 ? GREEN : a.percent >= 50 ? GOLD : RED};"></div>
      </div>
    </div>`).join("")}` : `<div style="font-size:13px;color:${GRAY};text-align:center;padding:12px 0;">Aún no hay integrantes en este grupo.</div>`}
    <div style="font-size:11px;color:${GRAY};margin-top:8px;">Días en pista: fechas de la temporada (desde el 19 de julio) con registro presente/ausente. Se excluyen la pretemporada, los días libres y los días sin entrenamiento. Cada integrante se mide contra el total de días del grupo.</div>
  </div>`;
  return html;
}

/* ========== RENDER RESUMEN GENERAL ========== */

function renderSummaryTab(){
  // Lista de grupos: todos ordenados por categoría (si es Mamel, solo U12)
  let groupsList = groupsSortedByCategory();
  if(isMamelCoordinator()){
    groupsList = groupsList.filter(g => g.name && g.name.includes("U12"));
  }

  const groupIds = groupsList.map(g => g.id);
  const totalAthletes = athletes.filter(a => groupIds.includes(a.groupId)).length;
  // Solo temporada en pistas (excluye pretemporada)
  const globalRecords = attendance.filter(r => groupIds.includes(r.groupId) && r.period === "temporada_26");
  const globalStats = calculateAttendanceStats(globalRecords);

  let html = `<div class="card">

/* ============ FUNCIONES DE MODAL Y EDICIÓN ============ */
function openDayEditModal(type, id, date){
  const att = type === "trainer" 
    ? trainerAttendance.find(t => t.trainerId === id && t.date === date)
    : attendance.find(a => a.athleteId === id && a.date === date);
  
  dayEditModal = { type, id, date, status: att?.status || "present", notes: att?.notes || "" };
  dayEditStatus = dayEditModal.status;
  dayEditNotes = dayEditModal.notes;
  render();
}

function closeDayEditModal(){
  dayEditModal = null;
  dayEditStatus = "";
  dayEditNotes = "";
  render();
}

async function saveDayEdit(){
  if(!dayEditModal) return;
  const { type, id, date } = dayEditModal;
  const period = classifyPeriod(date);
  const table = type === "trainer" ? "trainer_attendance" : "attendance";
  const idField = type === "trainer" ? "trainer_id" : "athlete_id";
  
  try{
    const existing = type === "trainer"
      ? trainerAttendance.find(t => t.trainerId === id && t.date === date)
      : attendance.find(a => a.athleteId === id && a.date === date);
    
    if(existing){
      const data = { status: dayEditStatus, notes: dayEditNotes, period };
      await sbUpdate(table, { id: existing.id }, data);
      existing.status = dayEditStatus;
      existing.notes = dayEditNotes;
      existing.period = period;
    } else {
      const data = { [idField]: id, date, status: dayEditStatus, notes: dayEditNotes, period, present: dayEditStatus === "present" };
      const row = await sbInsert(table, data);
      if(type === "trainer"){
        trainerAttendance.push(mapTrainerAttendance(row));
      } else {
        attendance.push(mapAttendance(row));
      }
    }
    
    // Auditoría propia en memoria (NO usar checkinAuditLog: es de chequeos semanales)
    attendanceAuditLog.push({
      id: uid(), type, entityId: id, date,
      oldStatus: existing ? existing.status : "nuevo",
      newStatus: dayEditStatus,
      changedAt: new Date().toISOString(),
      changedBy: (authState && authState.trainerCode) || "jefe"
    });
    
    closeDayEditModal();
    calculateAlerts();
    render();
  } catch(e){
    alert("Error al guardar: " + e.message);
  }
}

async function deleteDayRecord(){
  if(!dayEditModal) return;
  const { type, id, date } = dayEditModal;
  const table = type === "trainer" ? "trainer_attendance" : "attendance";
  
  if(!confirm("¿Eliminar este registro?")) return;
  
  try{
    const existing = type === "trainer"
      ? trainerAttendance.find(t => t.trainerId === id && t.date === date)
      : attendance.find(a => a.athleteId === id && a.date === date);
    
    if(existing){
      await sbDelete(table, { id: existing.id });
      if(type === "trainer"){
        trainerAttendance = trainerAttendance.filter(t => t.id !== existing.id);
      } else {
        attendance = attendance.filter(a => a.id !== existing.id);
      }
    }
    
    closeDayEditModal();
    calculateAlerts();
    render();
  } catch(e){
    alert("Error al eliminar: " + e.message);
  }
}

function getDayLabel(dateStr){
  const [y,m,d] = dateStr.split("-").map(Number);
  const months = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const days = ["Dom","Lun","Mar","Mié","Jue","Vie","Sab"];
  const date = new Date(y,m-1,d);
  return `${days[date.getDay()]} ${d} de ${months[m-1]}`;
}

/* ============ FUNCIONES DE IMPORTACIÓN ============ */
function handleFileImport(event){
  const file = event.target.files[0];
  if(!file) return;
  
  const XLSX = window.XLSX;
  const reader = new FileReader();
  
  reader.onload = (e) => {
    try{
      const wb = XLSX.read(e.target.result, { type: "binary" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(ws);
      
      importPreview = data.slice(0, 10);
      importProgress = { loaded: data.length, total: data.length };
      render();
      
      // Procesar importación
      processImportData(data);
    } catch(err){
      alert("Error al leer archivo: " + err.message);
    }
  };
  reader.readAsBinaryString(file);
}

async function processImportData(data){
  const table = filterTrainer ? "trainer_attendance" : "attendance";
  let imported = 0;
  
  for(const row of data){
    try{
      const date = row.Fecha || row.Date || "";
      const status = (row.Estado || row.Status || "").toLowerCase();
      const notes = row.Notas || row.Notes || "";
      
      if(!date || !["present", "absent", "free_day", "no_training"].includes(status)) continue;
      
      const period = classifyPeriod(date);
      const payload = { date, status, notes, period, present: status === "present" };
      
      if(table === "trainer_attendance" && filterTrainer){
        payload.trainer_id = filterTrainer;
      } else if(filterAthlete){
        payload.athlete_id = filterAthlete;
      }
      
      await sbInsert(table, payload, { onConflict: "id", merge: true });
      imported++;
    } catch(e){
      console.error("Error importando fila:", e);
    }
  }
  
  alert(`Importados ${imported} registros`);
  await loadAllData();
  calculateAlerts();
  render();
}




async function marcarEntrenadorDia(trainerId, estado){
  const fecha = trainerAttDate, periodo = classifyPeriod(fecha);
  trainerSaveError = ""; trainerSaving = true; render();
  try{
    const ex = trainerAttendance.find(r => r.trainerId === trainerId && r.date === fecha);
    if(ex){
      const esNoCuenta = (estado === "free_day" || estado === "no_training");
      await sbUpdate("trainer_attendance", { id: ex.id },
        esNoCuenta ? { status: estado, period: periodo, present: false }
                   : { status: estado, period: periodo, present: estado === "present" });
      ex.status = estado; ex.period = periodo;
      if(esNoCuenta){ ex.present = false; trainerAttendanceState[trainerId] = false; }
    } else {
      const row = await sbInsert("trainer_attendance",
        { trainer_id: trainerId, date: fecha, present: estado === "present", status: estado, period: periodo },
        { onConflict: "trainer_id,date", merge: true });
      trainerAttendance.push(mapTrainerAttendance(Array.isArray(row) ? row[0] : row));
    }
    if(estado === "present" || estado === "absent") trainerAttendanceState[trainerId] = estado === "present";
  }catch(e){
    trainerSaveError = `No se pudo cambiar el estado de ese entrenador. Detalle: ${e.message}.`;
  }
  trainerSaving = false; render();
}

function estadoEntrenador(trainerId){
  const r = trainerAttendance.find(x => x.trainerId === trainerId && x.date === trainerAttDate);
  return r ? r.status : null;
}

/* ============ ESTADO DEL DIA (libre / sin entrenamiento) ============ */
function estadoDelDia(fecha){
  const rows = trainerAttendance.filter(r => r.date === fecha);
  if(!rows.length) return "vacio";
  if(rows.every(r => r.status === "free_day"))    return "free_day";
  if(rows.every(r => r.status === "no_training")) return "no_training";
  return "normal";
}

async function marcarDia(nuevoEstado){
  const fecha = trainerAttDate;
  const periodo = classifyPeriod(fecha);
  trainerSaveError = ""; trainerSaving = true; render();
  try{
    const existentes = trainerAttendance.filter(r => r.date === fecha);
    if(existentes.length){
      const patch = nuevoEstado === "normal"
        ? null
        : { status: nuevoEstado, period: periodo, present: false };
      if(patch){
        await sbUpdate("trainer_attendance", { date: fecha }, patch);
        existentes.forEach(r => { r.status = nuevoEstado; r.period = periodo; r.present = false; });
      trainers.forEach(t => { trainerAttendanceState[t.id] = false; });
      } else {
        for(const r of existentes){
          const st = r.present ? "present" : "absent";
          await sbUpdate("trainer_attendance", { id: r.id }, { status: st, period: periodo });
          r.status = st; r.period = periodo;
        }
      }
    } else if(nuevoEstado !== "normal"){
      const rows = trainers.map(t => ({ trainer_id: t.id, date: fecha, present: false, status: nuevoEstado, period: periodo }));
      if(rows.length){
        const saved = await sbInsert("trainer_attendance", rows, {onConflict:"trainer_id,date", merge:true});
        (Array.isArray(saved)?saved:[saved]).forEach(row => trainerAttendance.push(mapTrainerAttendance(row)));
      }
    }
    trainerJustSaved = true;
  }catch(e){
    trainerSaveError = `No se pudo cambiar el estado del día. Detalle: ${e.message}.`;
  }
  trainerSaving = false; render();
}

async function borrarDia(){
  const fecha = trainerAttDate;
  const n = trainerAttendance.filter(r => r.date === fecha).length;
  if(!n) return;
  if(!confirm(`¿Borrar los ${n} registros de asistencia del ${formatFechaLarga(fecha)}? No se puede deshacer.`)) return;
  trainerSaveError = ""; trainerSaving = true; render();
  try{
    await sbDelete("trainer_attendance", { date: fecha });
    trainerAttendance = trainerAttendance.filter(r => r.date !== fecha);
  }catch(e){
    trainerSaveError = `No se pudo borrar. Detalle: ${e.message}.`;
  }
  trainerSaving = false; render();
}

async function adjustTransport(id, delta){
  const rec = trainerTransport.find(t => t.id === id);
  if(!rec) return;
  const nuevo = Math.min(6, Math.max(1, (rec.numTrainers||1) + delta));
  if(nuevo === rec.numTrainers) return;
  transportAdminError = "";
  const previo = rec.numTrainers;
  rec.numTrainers = nuevo; render();
  try{
    await sbUpdate("trainer_transport", { id }, { num_trainers: nuevo });
  }catch(e){
    rec.numTrainers = previo;
    transportAdminError = "No se pudo guardar el cambio: " + e.message;
    render();
  }
}

async function removeTransport(id){
  const rec = trainerTransport.find(t => t.id === id);
  if(!rec) return;
  if(!confirm(`¿Eliminar el registro de transporte de ${rec.trainerCode} del ${formatFechaLarga(rec.date)}?`)) return;
  transportAdminError = "";
  try{
    await sbDelete("trainer_transport", { id });
    trainerTransport = trainerTransport.filter(t => t.id !== id);
  }catch(e){
    transportAdminError = "No se pudo eliminar: " + e.message;
  }
  render();
}

async function addTransport(code, num){
  if(!code) return;
  transportAdminError = "";
  try{
    const row = await sbInsert("trainer_transport", {
      trainer_code: code, date: adminTransportDate, num_trainers: num
    });
    trainerTransport.push({ id:row.id, trainerCode:row.trainer_code, date:row.date, numTrainers:row.num_trainers });
  }catch(e){
    transportAdminError = "No se pudo agregar: " + e.message;
  }
  render();
}

async function saveAthleteNota(athleteId){
  const at = athletes.find(a => a.id === athleteId);
  if(!at) return;
  const texto = (athleteNotas[athleteId] !== undefined ? athleteNotas[athleteId] : at.notas) || "";
  if(texto === (at.notas || "")) return;   // sin cambios
  notasSaving[athleteId] = true;
  try{
    await sbUpdate("athletes", { id: athleteId }, { notas: texto });
    at.notas = texto;
    delete athleteNotas[athleteId];
  }catch(e){
    alert("No se pudo guardar la nota: " + e.message);
  }
  notasSaving[athleteId] = false;
  render();
}

/* ============ CALENDARIO DE CARRERAS (FEDESKI 2026) ============ */
const CAT_CARRERAS = ["U10","U12","U14","U16","U18"];

function renderCarrerasTab(){
  const hoy = todayISO();
  let lista = CARRERAS.slice();
  if(filtroCatCarrera) lista = lista.filter(c => (c.g||"").includes(filtroCatCarrera));

  let html = `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
      <div class="section-label" style="margin:0;"><div class="gate-poles"><span></span><span></span></div><span class="title">Calendario de carreras</span></div>
    </div>
    <div style="font-size:11px;color:${GRAY};margin-top:6px;">FEDESKI · Calendario Alpino 2026, actualizado al 21.07.26</div>
    <div class="cat-chips">
      <button type="button" class="cat-chip${filtroCatCarrera===""?" active":""}" data-catcarrera="">Todas</button>
      ${CAT_CARRERAS.map(c => `<button type="button" class="cat-chip${filtroCatCarrera===c?" active":""}" data-catcarrera="${c}">${c}</button>`).join("")}
    </div>
  </div>`;

  if(!lista.length){
    return html + `<div class="card"><div style="font-size:13px;color:${GRAY};text-align:center;padding:16px 0;">No hay carreras para esa categoría.</div></div>`;
  }

  const meses = {};
  lista.forEach(c => { const m = c.f.slice(0,7); (meses[m] = meses[m] || []).push(c); });

  Object.keys(meses).sort().forEach(m => {
    const [y, mm] = m.split("-");
    html += `<div class="card">
      <div class="mes-titulo">${MESES[+mm-1]} ${y}</div>`;
    meses[m].forEach(c => {
      const pasada = c.f < hoy;
      const est = (c.s||"").toLowerCase();
      const clase = est.startsWith("cancel") ? "cancelada" : est.startsWith("reprog") ? "reprogramada" : "inscrita";
      html += `<div class="carrera${pasada?" pasada":""}">
        <div class="carrera-fecha">
          <span class="cf-dia">${escapeHtml(c.d)}</span>
          <span class="cf-num">${c.f.slice(8)}</span>
        </div>
        <div class="carrera-info">
          <div class="carrera-top">
            <span class="carrera-nombre">${escapeHtml(c.n)}</span>
            ${c.s ? `<span class="estado-chip ${clase}">${escapeHtml(c.s)}</span>` : ""}
          </div>
          <div class="carrera-lugar">${escapeHtml(c.l)}${c.c?` · ${escapeHtml(c.c)}`:""}</div>
          <div class="carrera-tags">
            ${c.e ? `<span class="tag esp">${escapeHtml(c.e)}</span>` : ""}
            ${c.g ? `<span class="tag">${escapeHtml(c.g)}</span>` : ""}
            ${c.x ? `<span class="tag">${escapeHtml(c.x)}</span>` : ""}
          </div>
          ${c.t ? `<div class="carrera-dt">DT: ${escapeHtml(c.t)}</div>` : ""}
          ${c.o ? `<div class="carrera-nota">${escapeHtml(c.o)}</div>` : ""}
        </div>
      </div>`;
    });
    html += `</div>`;
  });
  return html;
}

function render(){
  const app = document.getElementById("app");
  document.body.classList.toggle("solo-lectura", soloLectura());
  if(accessConfig === null){
    app.innerHTML = renderFirstTimeSetup();
    attachSetupScreenHandlers();
    return;
  }
  if(!authState){
    app.innerHTML = renderLogin();
    attachLoginScreenHandlers();
    return;
  }
  if(authState.level === "category" && !selectedGroupId){
    currentProgram = authState.program;
    const g = ensureCategoryGroup(authState.program, authState.category);
    selectedGroupId = g.id;
  }
  if(tab === "daily" || tab === "profile"){
    // keep forms in sync lazily; only (re)initialize when needed by caller
  }
  let body = "";
  if(tab === "setup") body = renderSetupTab();
  else if(tab === "daily") body = renderDailyTab();
  else if(tab === "profile") body = renderProfileTab();
  else if(tab === "summary" && esJefeODirectorio()) body = renderSummaryTab();
  else if(tab === "access" && authState.level === "master") body = renderAccessTab();
  else if(tab === "trainers" && esJefeODirectorio()) body = renderTrainersTab();
  else if(tab === "carreras" && (esJefeODirectorio() || CODIGOS_CARRERAS.includes(authState.trainerCode))) body = renderCarrerasTab();
  else if(tab === "checkins") body = renderCheckinsTab();
  else if(tab === "transport") body = renderTransportTab();
  else { tab = "daily"; body = renderDailyTab(); }

  app.innerHTML = renderHeader() + (soloLectura() ? `<div class="ro-banner">👁️ Perfil Directorio · solo lectura. Puedes revisar todo, pero no modificar.</div>` : "") + (shouldShowMondayReminder() ? renderMondayBanner() : "") + `<div class="wrap">${body}</div>
    <div class="footer-note">Los datos se sincronizan automáticamente entre todos los dispositivos.</div>`;
  attachAppHandlers();
}

function initTrazadoCanvas(canvas, sessionNum){
  const ctx = canvas.getContext("2d");
  canvas._trazadoColor = "#1A1A1A";
  const existing = sessionState[sessionNum] && sessionState[sessionNum].trazado;
  if(existing){
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    img.src = existing;
  }
  let drawing = false;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const scaleX = canvas.width / r.width, scaleY = canvas.height / r.height;
    const p = e.touches ? e.touches[0] : e;
    return { x: (p.clientX - r.left) * scaleX, y: (p.clientY - r.top) * scaleY };
  }
  function start(e){ drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
  function move(e){
    if(!drawing) return;
    const p = pos(e);
    ctx.lineTo(p.x, p.y); ctx.strokeStyle = canvas._trazadoColor; ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.stroke();
    e.preventDefault();
  }
  function end(){
    if(!drawing) return;
    drawing = false;
    if(!sessionState[sessionNum]) return;
    sessionState[sessionNum].trazado = canvas.toDataURL("image/png");
  }
  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start, {passive:false});
  canvas.addEventListener("touchmove", move, {passive:false});
  canvas.addEventListener("touchend", end);
}

  });

/* ============ INIT ============ */
function showLoadingScreen(msg){
  document.getElementById("app").innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:${GRAY};font-size:14px;text-align:center;padding:20px;">${msg || "Cargando sistema..."}</div>`;
}
function showFatalError(message){
  document.getElementById("app").innerHTML = `<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;color:${RED};font-size:14px;gap:12px;">
    <div>No se pudo conectar con la base de datos.<br>Detalle: ${escapeHtml(message)}</div>
    <button onclick="location.reload()" style="padding:8px 16px;border-radius:8px;border:1px solid ${RED};background:white;color:${RED};cursor:pointer;">Reintentar</button>
  </div>`;
}

async function loadAllData(){
  const [gRows, aRows, sRows, atRows, acRows, trRows, taRows, wcRows, calRows, ttRows] = await Promise.all([
    sbSelect("groups"), sbSelect("athletes"), sbSelect("sessions"), sbSelect("attendance"), sbSelect("access_config"),
    sbSelect("trainers"), sbSelect("trainer_attendance"), sbSelect("weekly_checkins"), sbSelect("checkin_audit_log"), sbSelect("trainer_transport")
  ]);
  groups = gRows.map(r => ({id:r.id, name:r.name, program:r.program}));
  athletes = aRows.map(mapAthlete);
  sessions = sRows.map(mapSession);
  attendance = atRows.map(mapAttendance);
  if(acRows && acRows[0]){
    accessConfig = { masterCode: acRows[0].master_code, categoryCodes: acRows[0].category_codes, directorioCode: acRows[0].directorio_code || "" };
    if(acRows[0].coordinator_map && Object.keys(acRows[0].coordinator_map).length){
      COORDINATOR_MAP = acRows[0].coordinator_map;
      COORDINATOR_CODES = Array.from(new Set(Object.values(COORDINATOR_MAP).filter(v => v !== "JEFE")));
    }
  }
  trainers = trRows.map(r => ({id:r.id, name:r.name}));
  trainerAttendance = taRows.map(mapTrainerAttendance);
  weeklyCheckins = wcRows.map(r => ({id:r.id, groupId:r.group_id, trainerCode:r.trainer_code, weekStart:r.week_start, q1:r.q1||"", q2:r.q2||"", q3:r.q3||"", q4:r.q4||"", q5:r.q5||"", q6:r.q6||"", sentToJefe:!!r.sent_to_jefe, sentAt:r.sent_at}));
  trainerTransport = ttRows.map(r => ({id:r.id, trainerCode:r.trainer_code, date:r.date, numTrainers:r.num_trainers}));
  // Abrir la vista de transporte en el ultimo dia con registros (si hoy no tiene)
  if(!trainerTransport.some(t => t.date === adminTransportDate) && trainerTransport.length){
    adminTransportDate = trainerTransport.map(t => t.date).sort().slice(-1)[0];
  }
  checkinAuditLog = calRows.map(r => ({id:r.id, groupId:r.group_id, trainerCode:r.trainer_code, weekStart:r.week_start, action:r.action, q1:r.q1, q2:r.q2, q3:r.q3, q4:r.q4, q5:r.q5, q6:r.q6, changedAt:r.changed_at}));
}

async function init(){
  showLoadingScreen();
  try{
    await loadAllData();
  }catch(e){
    showFatalError(e.message);
    return;
  }

  authState = lsGet(K_AUTH, null);

  if(authState && authState.level === "category"){
    currentProgram = authState.program;
    const g = ensureCategoryGroup(authState.program, authState.category);
    selectedGroupId = g.id;
  } else if(groupsForProgram(currentProgram)[0]){
    selectedGroupId = groupsForProgram(currentProgram)[0].id;
  }
  if(authState){
    if(tab === "daily") initDailyForm();
    const list = groupAthletes();
    if(list.length) profileAthleteId = list[0].id;
  }
  render();
}

let refreshing = false;
let lastSync = null;
async function manualRefresh(){
  refreshing = true; render();
  try{
    await loadAllData();
    lastSync = new Date();
  }catch(e){
    alert("No se pudo actualizar: " + e.message);
  }
  refreshing = false;
  render();
}

init();
</script>

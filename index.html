<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CEC 26</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#BC1A25">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CEC 26">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#1A1A1A; --red:#BC1A25; --blue:#3E92CC; --snow:#F7F7F7;
    --gray:#8D8D8D; --gold:#FFB703; --green:#2E8B57; --border:#DDDDDD;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--snow); font-family:'Inter',sans-serif; color:#3A4658;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  .hero{background:var(--navy); padding:20px 20px 24px; position:relative; overflow:hidden;}
  .hero .gates{position:absolute; top:0; right:0; height:22px; display:flex; gap:6px; padding-right:12px; opacity:.4;}
  .hero .gates div{width:5px;}
  .eyebrow{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.2em; font-size:12px; color:var(--gold); margin-bottom:4px;}
  .hero-title{font-family:'Oswald',sans-serif; font-weight:700; color:white; font-size:1.7rem; line-height:1.1;}
  .hero-sub{color:#D9D9D9; font-size:13px; margin-top:2px;}
  .hero-top-row{display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:8px;}
  .role-badges{display:flex; gap:8px; flex-wrap:wrap;}
  .role-badge{display:flex; align-items:center; gap:5px; font-size:12px; background:#2B2B2B; color:#D9D9D9; border-radius:8px; padding:6px 10px; border:none;}

  .tabs{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .tab-btn{font-size:13px; padding:7px 12px; border-radius:8px; border:none; font-weight:500;}

  .menu-wrap{position:relative;}
  .header-menu{position:absolute; right:0; top:calc(100% + 6px); background:#2B2B2B; border-radius:10px; padding:6px; display:flex; flex-direction:column; gap:2px; min-width:170px; box-shadow:0 8px 24px rgba(0,0,0,.35); z-index:60;}
  .header-menu button{background:none; border:none; color:#D9D9D9; padding:9px 12px; text-align:left; font-size:13px; border-radius:7px; display:flex; align-items:center; gap:6px;}
  .header-menu button:hover{background:#3A3A3A;}
  .monday-banner{
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    background:var(--gold); color:var(--navy); padding:12px 16px; font-size:13px; font-weight:600;
  }
  .monday-banner .banner-btn{background:var(--navy); color:white; border:none; border-radius:8px; padding:7px 12px; font-size:12px; font-weight:600;}
  .monday-banner .banner-close{background:none; border:none; color:var(--navy); font-size:16px; padding:4px 6px; opacity:.7;}

  .program-tabs{display:flex; gap:16px; margin-top:14px; flex-wrap:wrap; border-bottom:1px solid #2E2E2E;}
  .program-btn{background:none; border:none; color:#9A9A9A; font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.08em; font-size:13px; padding:6px 2px 9px; border-bottom:2px solid transparent; margin-bottom:-1px;}
  .program-btn.active{color:var(--gold); border-bottom-color:var(--gold); font-weight:600;}

  /* DASHBOARD & FILTROS */
  .dashboard-kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:16px;}
  .kpi-card{background:white; border-radius:12px; padding:14px; border-left:4px solid var(--navy); box-shadow:0 2px 8px rgba(11,37,69,.08);}
  .kpi-label{font-size:11px; color:var(--gray); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px;}
  .kpi-value{font-size:1.6rem; font-weight:700; color:var(--navy);}
  .kpi-sub{font-size:11px; color:var(--gold); margin-top:2px;}
  .alert-kpi{border-left-color:var(--red);}
  .success-kpi{border-left-color:var(--green);}
  
  .filter-bar{background:white; border-radius:12px; padding:14px; margin-bottom:16px; box-shadow:0 2px 8px rgba(11,37,69,.08);}
  .filter-title{font-size:12px; font-weight:600; color:var(--navy); margin-bottom:10px; text-transform:uppercase; letter-spacing:.04em;}
  .filter-row{display:flex; gap:8px; flex-wrap:wrap;}
  .filter-select{font-size:12px; padding:7px 10px; border-radius:6px; border:1px solid var(--border); background:white; color:var(--navy);}
  .filter-btn{font-size:12px; padding:7px 12px; border-radius:6px; border:none; background:var(--navy); color:white; cursor:pointer;}
  .filter-btn:hover{opacity:.9;}
  .filter-btn.clear{background:#E0E0E0; color:var(--navy);}
  
  /* ALERTAS */
  .alert-badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:4px 8px; border-radius:6px; background:#FFF4F4; color:var(--red);}
  .alert-banner{background:#FFF4F4; border-left:4px solid var(--red); border-radius:8px; padding:10px 12px; margin-bottom:12px; font-size:12px; color:var(--red);}
  .alert-list{list-style:none; margin:0; padding:0;}
  .alert-list li{padding:6px 0; display:flex; gap:6px; align-items:flex-start;}
  .alert-icon{font-size:14px; flex-shrink:0;}
  
  /* MULTI-SELECCIÓN */
  .date-range-picker{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .date-range-picker input{padding:6px 8px; font-size:12px; border:1px solid var(--border); border-radius:6px;}
  .selected-range{font-size:12px; color:var(--navy); font-weight:600;}
  .selection-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .status-btn{font-size:12px; padding:6px 10px; border-radius:6px; border:1px solid var(--border); background:white; color:var(--navy); cursor:pointer;}
  .status-btn:hover{background:#F0F0F0;}
  
  /* MODAL MEJORADO */
  .modal-overlay{position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:100;}
  .modal-content{background:white; border-radius:16px; padding:24px; max-width:400px; width:90%; max-height:80vh; overflow-y:auto;}
  .modal-header{font-size:16px; font-weight:700; color:var(--navy); margin-bottom:16px;}
  .modal-close{position:absolute; top:14px; right:14px; background:none; border:none; color:var(--gray); font-size:18px; cursor:pointer;}
  .modal-status-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
  .modal-status-btn{padding:12px; border-radius:10px; border:2px solid var(--border); background:white; color:var(--navy); cursor:pointer; font-size:13px; font-weight:600;}
  .modal-status-btn.selected{border-color:var(--navy); background:var(--navy); color:white;}
  .modal-notes{margin:16px 0;}
  .modal-notes label{display:block; font-size:12px; font-weight:600; color:var(--navy); margin-bottom:6px;}
  .modal-notes textarea{width:100%; min-height:60px; padding:8px; border:1px solid var(--border); border-radius:8px; font-size:13px; color:var(--navy);}
  .modal-actions{display:flex; gap:8px; margin-top:16px;}
  .modal-actions button{flex:1; padding:10px; border-radius:8px; border:none; font-size:13px; font-weight:600; cursor:pointer;}
  .modal-save{background:var(--green); color:white;}
  .modal-delete{background:#FFE4E4; color:var(--red);}
  .modal-cancel{background:var(--border); color:var(--navy);}
  
  /* PESTAÑAS DE PERÍODO */
  .period-tabs{display:flex; gap:12px; margin-bottom:16px; border-bottom:2px solid var(--border);}
  .period-tab{padding:10px 16px; border-bottom:3px solid transparent; font-size:13px; font-weight:600; color:var(--gray); cursor:pointer;}
  .period-tab.active{color:var(--gold); border-bottom-color:var(--gold);}
  
  /* CALENDARIO CON GRID */
  .calendar-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:16px;}
  .calendar-day{aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:8px; border:1px solid var(--border); background:white; cursor:pointer; font-size:12px; font-weight:600; transition:all .2s;}
  .calendar-day:hover{box-shadow:0 4px 12px rgba(11,37,69,.15);}
  .calendar-day.present{background:#E8F5E9; color:var(--green); border-color:var(--green);}
  .calendar-day.absent{background:#FFF3CD; color:#856404; border-color:#FFC107;}
  .calendar-day.free{background:#F0F0F0; color:var(--gray); border-color:var(--gray);}
  .calendar-day.no_training{background:#E3F2FD; color:var(--blue); border-color:var(--blue);}
  .calendar-day.selected{box-shadow:0 0 0 3px rgba(11,37,69,.2);}
  .calendar-day.disabled{opacity:.4; cursor:default;}
  
  /* HISTORIAL */
  .history-list{border:1px solid var(--border); border-radius:10px; overflow:hidden;}
  .history-item{padding:12px; border-bottom:1px solid var(--border); font-size:12px;}
  .history-item:last-child{border-bottom:none;}
  .history-time{color:var(--gray); font-size:11px;}
  .history-change{color:var(--navy); font-weight:600; margin:2px 0;}
  
  /* IMPORTAR */
  .file-input-wrap{position:relative; overflow:hidden;}
  .file-input-wrap input[type=file]{position:absolute; left:-9999px;}
  .file-input-label{display:inline-flex; align-items:center; gap:6px; padding:10px 16px; background:var(--navy); color:white; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600;}
  .upload-preview{margin-top:12px; padding:12px; background:#EEF3FA; border-radius:8px; border:1px solid var(--blue);}
  

  /* TRANSPORTE EDITABLE */
  .tr-edit-row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;background:#F7FAFC;margin-bottom:8px;}
  .tr-edit-name{flex:1;font-size:14px;font-weight:500;color:var(--navy);}
  .tr-stepper{display:flex;align-items:center;gap:8px;background:white;border:1px solid var(--border);border-radius:8px;padding:3px 6px;}
  .tr-stepper button{width:26px;height:26px;border:none;border-radius:6px;background:#EEF3FA;color:var(--navy);font-size:16px;font-weight:700;cursor:pointer;line-height:1;}
  .tr-stepper button:disabled{opacity:.35;cursor:default;}
  .tr-count{min-width:20px;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--navy);}
  .tr-del{border:none;background:none;cursor:pointer;font-size:15px;opacity:.55;}
  .tr-del:hover{opacity:1;}
  .tr-add-box{margin-top:14px;padding:12px;border:1px dashed var(--border);border-radius:10px;}
  .tr-add-label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--gray);margin-bottom:8px;}
  .tr-add-row{display:flex;gap:8px;}
  .tr-add-row .btn-navy{padding:8px 14px;}

  /* GRAFICO VIAJES COMPARTIDOS */
  .trips-chart{display:flex;flex-direction:column;gap:14px;}
  .trip-row{display:flex;flex-direction:column;gap:5px;}
  .trip-head{display:flex;justify-content:space-between;align-items:baseline;}
  .trip-name{font-size:13px;font-weight:600;color:var(--navy);}
  .trip-num{font-size:11px;color:var(--gray);font-family:'JetBrains Mono',monospace;}
  .trip-track{display:flex;height:26px;border-radius:6px;overflow:hidden;min-width:32px;box-shadow:inset 0 0 0 1px rgba(11,37,69,.06);}
  .trip-seg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;min-width:14px;}
  .trip-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px;padding-top:14px;border-top:1px solid var(--border);}
  .trip-leg-item{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--gray);}
  .trip-leg-item i{width:11px;height:11px;border-radius:3px;display:inline-block;}

  .migrupo-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .migrupo-row .btn-navy{white-space:nowrap;}

  .dia-estado{margin:0 0 12px;padding:10px;border:1px dashed var(--border);border-radius:10px;}
  .dia-estado-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--gray);margin-bottom:7px;}
  .dia-estado-lbl b{color:var(--navy);}
  .dia-estado-btns{display:flex;gap:6px;flex-wrap:wrap;}
  .dia-btn{flex:1;min-width:78px;padding:6px 8px;font-size:11px;font-weight:500;border:1px solid var(--border);border-radius:7px;background:white;color:var(--navy);cursor:pointer;}
  .dia-btn.active{background:var(--navy);border-color:var(--navy);color:white;}
  .dia-btn.del{flex:0 0 auto;min-width:0;color:#B3261E;border-color:#F0C4C4;}
  .dia-btn.del:hover{background:#FDECEC;}
  .periodo-tabs{display:flex;gap:6px;margin-bottom:10px;}
  .periodo-tab{flex:1;padding:7px 8px;font-size:12px;font-weight:500;border:1px solid var(--border);border-radius:8px;background:white;color:var(--gray);cursor:pointer;}
  .periodo-tab.active{background:var(--navy);border-color:var(--navy);color:white;}
  .cal-day.att-full{background:#E8F5E9;color:#2E7D32;}
  .cal-day.att-part{background:#FFF8E1;color:#8A6D00;}
  .cal-day.att-none{background:#FDECEC;color:#B3261E;}
  .cal-day.att-libre{background:#EEF0F3;color:var(--gray);}
  .cal-day.fuera-periodo{opacity:.32;}
  .cal-leyenda{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 14px;font-size:10px;color:var(--gray);}
  .cal-leyenda span{display:inline-flex;align-items:center;gap:4px;}
  .cal-leyenda .lg{width:9px;height:9px;border-radius:2px;display:inline-block;}
  .cal-leyenda .lg.att-full{background:#A5D6A7;} .cal-leyenda .lg.att-part{background:#FAC775;}
  .cal-leyenda .lg.att-none{background:#F09595;} .cal-leyenda .lg.att-libre{background:#CFD4DA;}
  .pct-periodos{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:10px;color:var(--gray);font-family:'JetBrains Mono',monospace;margin-top:3px;}
  .pill.mini{padding:6px 8px;font-size:11px;font-weight:600;min-width:26px;}
  .ind-leyenda{font-size:10px;color:var(--gray);margin:2px 0 10px;}
  .ind-leyenda b{color:var(--navy);}
  .panel{padding:0;overflow:hidden;}
  .panel.inner{border:1px solid var(--border);border-radius:10px;margin-bottom:14px;box-shadow:none;}
  .panel-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:none;border:none;cursor:pointer;text-align:left;}
  .panel-title{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:12px;color:var(--navy);}
  .panel-meta{font-size:11px;color:var(--gray);font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:6px;}
  .panel-body{padding:0 14px 14px;}
  .mini-stats{display:flex;gap:14px;flex-wrap:wrap;}
  .mini-stats>div{flex:1;min-width:88px;}
  .ms-val{display:block;font-size:1.25rem;font-weight:700;color:var(--navy);font-family:'JetBrains Mono',monospace;}
  .ms-lbl{display:block;font-size:10px;color:var(--gray);}
  .pct-excluidos{font-size:10px;color:var(--gray);font-family:'JetBrains Mono',monospace;margin-top:3px;}
  .obs-box{background:#FFFDF5;border:1px solid #F0E6C8;border-radius:12px;padding:12px;margin-bottom:16px;}
  .exp-grid{display:flex;flex-wrap:wrap;gap:6px;}
  .exp-btn{border:1px solid var(--border);background:white;color:var(--navy);font-size:10px;padding:2px 8px;border-radius:5px;cursor:pointer;white-space:nowrap;}
  .exp-btn:hover{background:#F0F0F0;}

  /* CALENDARIO DE CARRERAS */
  .btn-carreras{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;margin-bottom:14px;
    background:var(--navy);color:#fff;border:none;border-radius:12px;cursor:pointer;
    font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:13px;
    box-shadow:0 2px 8px rgba(11,37,69,.18);}
  .btn-carreras:hover{background:#0E2F58;}
  .btn-carreras span{font-size:15px;}
  .cat-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
  .cat-chip{padding:5px 12px;font-size:11px;font-weight:600;border:1px solid var(--border);border-radius:20px;
    background:#fff;color:var(--navy);cursor:pointer;font-family:'JetBrains Mono',monospace;}
  .cat-chip.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .mes-titulo{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:13px;
    color:var(--gold);border-bottom:2px solid var(--gold);padding-bottom:6px;margin-bottom:12px;}
  .carrera{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
  .carrera:last-child{border-bottom:none;padding-bottom:0;}
  .carrera.pasada{opacity:.45;}
  .carrera-fecha{flex:0 0 42px;text-align:center;background:#EEF3FA;border-radius:8px;padding:6px 0;height:fit-content;}
  .cf-dia{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--gray);}
  .cf-num{display:block;font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700;color:var(--navy);line-height:1.1;}
  .carrera-info{flex:1;min-width:0;}
  .carrera-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px;}
  .carrera-nombre{font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;color:var(--navy);}
  .carrera-lugar{font-size:12px;color:var(--gray);margin-bottom:5px;}
  .carrera-tags{display:flex;gap:5px;flex-wrap:wrap;}
  .tag{font-size:10px;padding:2px 7px;border-radius:5px;background:#F0F3F7;color:var(--navy);
    font-family:'JetBrains Mono',monospace;}
  .tag.esp{background:#FFF4D6;color:#8A6D00;font-weight:600;}
  .carrera-dt{font-size:11px;color:var(--gray);margin-top:5px;}
  .carrera-nota{font-size:11px;color:var(--gray);margin-top:4px;padding-left:8px;border-left:2px solid var(--border);}
  .estado-chip{font-size:9px;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
  .estado-chip.inscrita{background:#E8F5E9;color:#2E7D32;}
  .estado-chip.cancelada{background:#FDECEC;color:#B3261E;}
  .estado-chip.reprogramada{background:#FFF8E1;color:#8A6D00;}
  @media (max-width:480px){ .carrera-fecha{flex:0 0 38px;} .carrera-nombre{font-size:13px;} }

  .ro-banner{background:#EEF3FA;border-bottom:1px solid var(--border);color:var(--navy);
    font-size:12px;padding:9px 16px;text-align:center;}
  body.solo-lectura .save-btn,
  body.solo-lectura #add-trainer-btn, body.solo-lectura #new-trainer-name,
  body.solo-lectura [data-remove-trainer], body.solo-lectura [data-tatt],
  body.solo-lectura [data-dia-estado], body.solo-lectura [data-dia-borrar],
  body.solo-lectura [data-tlibre], body.solo-lectura .dia-estado,
  body.solo-lectura [data-tt-inc], body.solo-lectura [data-tt-dec],
  body.solo-lectura [data-tt-del], body.solo-lectura .tr-add-box,
  body.solo-lectura #migrupo-ir, body.solo-lectura #export-backup-full,
  body.solo-lectura #export-backup-btn, body.solo-lectura .modal-save,
  body.solo-lectura .modal-delete, body.solo-lectura #import-file,
  body.solo-lectura .file-input-label{ display:none !important; }
  body.solo-lectura textarea, body.solo-lectura input[type=text]{
    pointer-events:none; opacity:.6; background:#F5F5F5; }

  /* NOTAS DE ATLETA */
  .nota-box{margin-top:10px;}
  .nota-box label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--gray);margin-bottom:5px;}
  .nota-box textarea{width:100%;min-height:64px;padding:9px;border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--navy);font-family:inherit;resize:vertical;}
  .nota-chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 7px;border-radius:20px;background:#FFF8E1;color:#8A6D00;margin-left:6px;}

  @media (max-width:480px){
    .hero{padding:14px 16px 18px;}
    .hero-title{font-size:1.2rem;}
    .eyebrow{font-size:10px; margin-bottom:2px;}
    .role-badge{font-size:11px; padding:5px 8px;}
    .dashboard-kpis{grid-template-columns:repeat(2,1fr);}
    .modal-content{max-width:90vw;}
    .calendar-grid{gap:2px;}
    .filter-row{flex-direction:column;}
    .filter-select,.filter-btn{width:100;}
  }

  .wrap{max-width:720px; margin:-10px auto 0; padding:0 16px 40px;}
  .card{background:white; border-radius:16px; padding:20px; box-shadow:0 10px 30px rgba(11,37,69,.10); margin-bottom:16px;}

  label.field-label{display:block; font-size:12px; color:var(--gray); margin-bottom:6px;}
  input[type="text"], input[type="password"], textarea, input[type="date"]{
    width:100%; border:1px solid var(--border); border-radius:8px; padding:10px 12px;
    font-size:14px; color:var(--navy); outline:none;
  }
  textarea{resize:none;}

  .section-label{display:flex; align-items:center; gap:8px; margin:16px 0 10px;}
  .section-label:first-of-type{margin-top:0;}
  .gate-poles{display:flex; gap:2px;}
  .gate-poles span{display:inline-block; width:4px; height:18px; border-radius:2px;}
  .gate-poles span:nth-child(1){background:var(--red);}
  .gate-poles span:nth-child(2){background:var(--navy);}
  .section-label span.title{font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:13px; letter-spacing:.06em; color:var(--navy);}

  .pills{display:flex; flex-wrap:wrap; gap:8px;}
  .pill{
    font-size:14px; padding:8px 14px; border-radius:8px;
    border:1px solid var(--border); background:white; color:#3A4658;
  }
  .pill.active{color:white; font-weight:600; border-color:transparent; box-shadow:0 2px 8px rgba(11,37,69,.18);}

  .cat-btn{
    display:flex; align-items:center; gap:6px; font-family:'Oswald',sans-serif; text-transform:uppercase;
    font-size:14px; letter-spacing:.04em; padding:9px 14px; border-radius:8px; border:1px solid var(--border); background:white; color:#3A4658;
  }
  .cat-btn.created{border-color:#D9D9D9; color:var(--navy);}
  .cat-btn.selected{background:var(--navy); border-color:var(--navy); color:white;}
  .cat-btn .x{margin-left:2px; opacity:.75;}
  .cat-fixed{
    display:inline-flex; align-items:center; gap:6px; font-family:'Oswald',sans-serif; text-transform:uppercase;
    font-size:14px; letter-spacing:.04em; padding:9px 14px; border-radius:8px; background:var(--navy); color:white;
  }

  .stepper{flex:1; min-width:150px;}
  .stepper .lbl{font-size:12px; color:var(--gray); margin-bottom:6px;}
  .stepper .box{display:flex; align-items:center; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  .stepper button{background:none; border:none; font-family:'JetBrains Mono',monospace; font-size:18px; padding:8px 12px; color:var(--navy);}
  .stepper input{width:100%; text-align:center; border:none; outline:none; font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--navy); padding:8px 0;}
  .steppers{display:flex; flex-wrap:wrap; gap:12px; margin-bottom:12px;}

  .total-box{display:flex; align-items:center; justify-content:space-between; background:var(--navy); border-radius:12px; padding:10px 14px; margin-bottom:12px;}
  .trazado-box{border:2px solid var(--navy); border-radius:10px; overflow:hidden; background:#F7F7F7;}
  .trazado-canvas{display:block; width:100%; height:200px; touch-action:none; cursor:crosshair;}
  .total-box span.lbl{color:#D9D9D9; font-size:13px;}
  .total-box span.val{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:1.4rem; color:var(--gold);}

  .error-box{font-size:13px; background:#FDECEC; color:var(--red); border-radius:8px; padding:8px 12px; margin-bottom:12px;}
  .info-box{font-size:12px; background:#EEF3FA; color:var(--navy); border-radius:8px; padding:8px 12px; margin-bottom:12px;}

  .save-btn{
    width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.05em;
    background:var(--red); color:white; border:none; border-radius:12px; padding:13px; font-size:14px;
  }
  .btn-navy{background:var(--navy); color:white; border:none; border-radius:10px; padding:10px 16px; font-size:13px; display:flex; align-items:center; gap:6px; justify-content:center;}
  .btn-outline{background:white; border:1px solid var(--border); color:#3A4658; border-radius:10px; padding:10px 16px; font-size:13px; display:flex; align-items:center; gap:6px; justify-content:center;}

  select{
    appearance:none; font-size:14px; padding:8px 30px 8px 12px; border-radius:8px; border:1px solid var(--border);
    color:var(--navy); background:white url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%238D99AE"/></svg>') no-repeat right 10px center;
  }

  .athlete-card{border:1px solid #E7ECF2; border-radius:12px; background:#F7FAFC; margin-bottom:10px; overflow:hidden;}
  .athlete-row{display:flex; align-items:center; gap:8px; padding:10px 12px;}
  .athlete-name{flex:1; font-size:14px; font-weight:500; color:var(--navy);}
  .phone-badge{font-size:12px; color:var(--gray); display:flex; align-items:center; gap:4px;}
  .ficha-btn{font-size:12px; padding:5px 9px; border-radius:6px; border:1px solid var(--border); background:white; color:var(--navy); display:flex; align-items:center; gap:4px;}
  .ficha-btn.open{background:var(--navy); color:white;}
  .ficha-body{padding:4px 12px 14px; border-top:1px solid #E7ECF2;}

  .session-card{background:#F7FAFC; border:1px solid #E7ECF2; border-radius:12px; padding:16px; margin-bottom:16px;}
  .fund-box{background:#FFF6E0; border:1px solid #FCE7B0; border-radius:8px; padding:10px 12px; margin-bottom:12px;}

  .stat-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
  .stat-box{flex:1; min-width:110px; border-radius:12px; padding:12px; text-align:center;}
  .stat-val{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:1.3rem;}
  .stat-lbl{font-size:11px; color:#3A4658; margin-top:2px;}

  .pctbar-row{margin-bottom:8px;}
  .pctbar-top{display:flex; justify-content:space-between; font-size:12px; margin-bottom:3px;}
  .pctbar-track{width:100%; height:8px; border-radius:5px; background:#EEF1F5; overflow:hidden;}
  .pctbar-fill{height:100%;}

  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .login-card{width:100%; max-width:380px; background:white; border-radius:16px; padding:26px; text-align:center; box-shadow:0 10px 30px rgba(11,37,69,.10);}
  .setup-card{width:100%; max-width:440px; background:white; border-radius:16px; padding:26px; box-shadow:0 10px 30px rgba(11,37,69,.10);}
  .lock-circle{width:48px; height:48px; border-radius:999px; background:var(--navy); display:flex; align-items:center; justify-content:center; margin:0 auto 12px;}

  .footer-note{text-align:center; font-size:12px; color:var(--gray); padding:10px 20px 30px;}

  .cal-card{
    background:white; border-radius:16px; padding:18px;
    box-shadow:0 6px 18px rgba(0,0,0,.08); margin-bottom:16px; overflow:hidden;
  }
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .cal-head .label{font-family:'Oswald',sans-serif; font-weight:600; font-size:17px; color:var(--navy); text-transform:capitalize;}
  .cal-nav-btn{width:34px; height:34px; border-radius:9px; border:1px solid var(--border); background:white; color:var(--navy); font-size:17px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .cal-weekdays{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); margin-bottom:6px;}
  .cal-weekdays span{text-align:center; font-size:11px; color:var(--gray); font-weight:600; text-transform:uppercase;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px;}
  .cal-day{
    aspect-ratio:1; width:100%; display:flex; align-items:center; justify-content:center; border-radius:11px; border:none; background:none;
    font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:600; color:var(--navy); min-width:0; position:relative;
  }
  .cal-day.has-data::after{content:""; position:absolute; bottom:5px; left:50%; transform:translateX(-50%); width:5px; height:5px; border-radius:999px; background:var(--red);}
  .cal-day.selected.has-data::after{background:white;}
  .cal-day:hover{background:#F0F0F0;}
  .cal-day.other-month{color:#C9C9C9; font-weight:500;}
  .cal-day.today{box-shadow:inset 0 0 0 2px var(--red);}
  .cal-day.selected{background:var(--red); color:white;}
  .cal-today-btn{width:100%; margin-top:14px; padding:10px; border-radius:10px; border:1px solid var(--border); background:white; color:var(--navy); font-size:14px; font-weight:600;}
  .cal-card.collapsible{padding:8px 10px;}
  .date-toggle{width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; background:none; border:none; padding:8px; text-align:left;}
  .date-toggle .date-label{font-size:15px; font-weight:600; color:var(--navy);}
  .date-toggle .chev{font-size:12px; color:var(--gray); font-weight:500; flex-shrink:0;}
  .today-chip{display:inline-block; background:var(--green); color:white; font-size:11px; font-weight:600; border-radius:6px; padding:2px 7px; margin-left:4px; vertical-align:2px;}
  .date-warn{display:flex; align-items:center; justify-content:space-between; gap:8px; background:#FFF6E0; border:1px solid #FCE7B0; color:#8A6100; font-size:12px; border-radius:8px; padding:6px 10px; margin:2px 8px 8px;}
  .date-warn button{background:white; border:1px solid #E3C36B; border-radius:6px; padding:4px 10px; color:#8A6100; font-size:12px; font-weight:600; flex-shrink:0;}
  .cal-body{padding:6px 8px 10px;}
  .backup-row{display:flex; gap:8px; flex-wrap:wrap;}
</style>
</head>

function sbHeaders(extra){
  return Object.assign({ "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" }, extra || {});
}
async function sbSelect(table, qs){
  // Supabase corta en 1000 filas por defecto: hay que paginar o los totales salen truncados
  const PASO = 1000;
  let desde = 0, todo = [];
  for(;;){
    const res = await fetch(`${REST}/${table}?${qs || "select=*"}`, {
      headers: sbHeaders({ "Range-Unit": "items", "Range": `${desde}-${desde+PASO-1}` })
    });
    if(!res.ok) throw new Error(`${table}: ${res.status} ${await res.text()}`);
    const lote = await res.json();
    todo = todo.concat(lote);
    if(lote.length < PASO) break;      // ultima pagina
    desde += PASO;
    if(desde > 100000) break;          // tope de seguridad
  }
  return todo;
}
async function sbInsert(table, rowOrRows, opts={}){
  if(soloLectura()) throw new Error("El perfil Directorio es de solo lectura: no puede guardar cambios.");
  const params = opts.onConflict ? `?on_conflict=${opts.onConflict}` : "";
  const res = await fetch(`${REST}/${table}${params}`, {
    method: "POST",
    headers: sbHeaders({ "Prefer": (opts.merge ? "resolution=merge-duplicates," : "") + "return=representation" }),
    body: JSON.stringify(rowOrRows)
  });
  if(!res.ok) throw new Error(`${table} insert: ${res.status} ${await res.text()}`);
  const data = await res.json();
  return Array.isArray(rowOrRows) ? data : data[0];
}
async function sbUpdate(table, match, patch){
  if(soloLectura()) throw new Error("El perfil Directorio es de solo lectura: no puede guardar cambios.");
  const qs = Object.entries(match).map(([k,v]) => `${k}=eq.${encodeURIComponent(v)}`).join("&");
  const res = await fetch(`${REST}/${table}?${qs}`, { method: "PATCH", headers: sbHeaders({ "Prefer": "return=representation" }), body: JSON.stringify(patch) });
  if(!res.ok) throw new Error(`${table} update: ${res.status} ${await res.text()}`);
  const data = await res.json();
  return data[0];
}
async function sbDelete(table, match){
  if(soloLectura()) throw new Error("El perfil Directorio es de solo lectura: no puede guardar cambios.");
  const qs = Object.entries(match).map(([k,v]) => `${k}=eq.${encodeURIComponent(v)}`).join("&");
  const res = await fetch(`${REST}/${table}?${qs}`, { method: "DELETE", headers: sbHeaders() });
  if(!res.ok) throw new Error(`${table} delete: ${res.status} ${await res.text()}`);
}

const CORTE_TEMPORADA = "2026-07-18"; // <= esta fecha es Pre Temporada
function classifyPeriod(dateStr){
  if(!dateStr) return "temporada_26";
  return dateStr <= CORTE_TEMPORADA ? "pre_temporada" : "temporada_26";
}
function periodLabel(p){
  return p === "pre_temporada" ? "Pre Temporada" : "Temporada 26";
}

function getDateFromStr(dateStr){
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(y, m-1, d);
}

function calculateAttendanceStats(items, period = null){
  const filtered = period ? items.filter(i => i.period === period) : items;
  const present = filtered.filter(i => i.status === "present").length;
  const absent = filtered.filter(i => i.status === "absent").length;
  const free = filtered.filter(i => i.status === "free_day").length;
  const noTrain = filtered.filter(i => i.status === "no_training").length;
  const countable = present + absent;
  const percent = countable > 0 ? Math.round((present / countable) * 100) : 0;
  return { present, absent, free, noTrain, countable, percent };
}

function calculateAlerts(){
  alertsData = { lowAttendance: [], noTraining: [], consecutive: [] };
  
  // Entrenadores con baja asistencia
  trainers.forEach(trainer => {
    const stats = calculateAttendanceStats(trainerAttendance.filter(t => t.id && t.id.includes(trainer.id)));
    if(stats.percent < 80 && stats.countable > 0){
      alertsData.lowAttendance.push({ type: "trainer", name: trainer.name, percent: stats.percent });
    }
  });
  
  // Atletas con baja asistencia
  athletes.forEach(athlete => {
    const stats = calculateAttendanceStats(attendance.filter(a => a.athleteId === athlete.id));
    if(stats.percent < 80 && stats.countable > 0){
      alertsData.lowAttendance.push({ type: "athlete", name: athlete.name, percent: stats.percent });
    }
  });
}

/* ========== FUNCIONES DE RESUMEN GENERAL ========== */
function getGroupTrainingDays(groupId, periodFilter){
  // Obtener días únicos entrenados del grupo
  const records = attendance.filter(a => a.groupId === groupId);
  const filtered = periodFilter ? records.filter(r => r.period === periodFilter) : records;
  const uniqueDates = new Set(filtered.map(r => r.date));
  return uniqueDates.size;
}

function getGroupAthleteStats(groupId, periodFilter){
  // Estadísticas por atleta de un grupo.
  // Denominador: días en pista del GRUPO (fechas con presente/ausente).
  // Un integrante que se incorporó tarde igual se mide contra el total del grupo.
  const groupAthletesList = athletes.filter(a => a.groupId === groupId);

  const records = attendance.filter(a => a.groupId === groupId);
  const filtered = periodFilter ? records.filter(r => r.period === periodFilter) : records;
  const pista = filtered.filter(r => r.status === "present" || r.status === "absent");
  const groupDays = new Set(pista.map(r => r.date)).size;

  return groupAthletesList.map(a => {
    const mine = pista.filter(r => r.athleteId === a.id);
    const present = new Set(mine.filter(r => r.status === "present").map(r => r.date)).size;
    const total = groupDays;
    const percent = total > 0 ? Math.round((present / total) * 100) : 0;

    return {
      id: a.id,
      name: a.name,
      present,
      total,
      percent
    };
  }).sort((a, b) => b.percent - a.percent);
}

function getGroupIndividualAverage(athleteStatsList){
  // Promedio de los porcentajes individuales de los integrantes del grupo
  if(!athleteStatsList.length) return null;
  const sum = athleteStatsList.reduce((s, a) => s + a.percent, 0);
  return Math.round(sum / athleteStatsList.length);
}

function getGroupSummary(groupId, periodFilter){
  // Resumen completo de un grupo (cuenta atletas del grupo indicado, no del seleccionado)
  const groupAthletesList = athletes.filter(a => a.groupId === groupId);

  const records = attendance.filter(a => a.groupId === groupId);
  const filtered = periodFilter ? records.filter(r => r.period === periodFilter) : records;

  // Días en pista: solo fechas con registros presente/ausente
  // (excluye días libres y días sin entrenamiento)
  const pista = filtered.filter(r => r.status === "present" || r.status === "absent");
  const uniqueDates = new Set(pista.map(r => r.date)).size;
  const presenceStats = calculateAttendanceStats(filtered);

  return {
    groupId,
    trainingDays: uniqueDates,
    athleteCount: groupAthletesList.length,
    attendance: presenceStats
  };
}

/* ============ DERIVED HELPERS ============ */
function groupAthletes(){ return athletes.filter(a => a.groupId === selectedGroupId); }
function ensureCategoryGroup(program, name){
  let g = groups.find(gr => gr.program === program && gr.name === name);
  if(!g){
    g = { id: "tmp-" + uid(), name, program };
    groups.push(g);
    sbInsert("groups", {name, program}, {onConflict:"program,name", merge:true}).then(row => { g.id = row.id; }).catch(()=>{});
  }
  return g;
}
function groupsForProgram(program){
  let filtered = groups.filter(g => g.program === program);
  
  // Si es Mamel, filtrar solo grupos de U12
  if(isMamelCoordinator()) {
    filtered = filtered.filter(g => g.name && g.name.includes("U12"));
  }
  
  const order = PROGRAM_CATEGORIES[program] || [];
  return filtered.sort((a,b) => order.indexOf(a.name) - order.indexOf(b.name));
}
function groupsSortedByCategory(){
  return [...groups].sort((a,b) => {
    const pA = PROGRAMS.indexOf(a.program), pB = PROGRAMS.indexOf(b.program);
    if(pA !== pB) return pA - pB;
    const cA = (PROGRAM_CATEGORIES[a.program]||[]).indexOf(a.name);
    const cB = (PROGRAM_CATEGORIES[b.program]||[]).indexOf(b.name);
    return cA - cB;
  });
}

function athletePeriodStats(athleteId, periodo){
  const recs = attendance.filter(a => a.athleteId === athleteId && a.period === periodo);
  const cuentan = recs.filter(a => a.status === "present" || a.status === "absent");
  const present = cuentan.filter(a => a.status === "present").length;
  const excl = new Set(recs.filter(a => a.status === "no_training" || a.status === "free_day").map(a => a.date)).size;
  return { present, total: cuentan.length, excl,
           pct: cuentan.length ? Math.round(present/cuentan.length*100) : null };
}

function athleteStats(athleteId, groupId){
  const attRecs = attendance.filter(a => a.athleteId === athleteId
    && (a.status === "present" || a.status === "absent"));
  const totalDays = attRecs.length;
  const presentDays = attRecs.filter(a => a.status === "present").length;
  const attendancePct = totalDays ? Math.round(presentDays/totalDays*100) : 0;
  const presentDates = new Set(attRecs.filter(a=>a.status==="present").map(a=>a.date));
  const credited = sessions.filter(s => s.groupId === groupId && presentDates.has(s.date));
  const cfg = configForGroup(groupId);

  function pct(key, options){
    const total = credited.length;
    const counts = {};
    credited.forEach(s => { counts[s[key]] = (counts[s[key]]||0) + 1; });
    return options.map(o => ({name:o, value: total? Math.round(((counts[o]||0)/total)*100) : 0}));
  }
  const educativas = credited.filter(s => s.trabajo === "Ejercicios educativos");
  const fundamentosPct = FUNDAMENTOS.map(f => ({
    name:f,
    value: educativas.length? Math.round((educativas.filter(s => (s.fundamentos||[]).includes(f)).length / educativas.length)*100) : 0
  }));

  return {
    attendancePct, presentDays, totalDays,
    disciplina: pct("disciplina", cfg.disciplinas),
    nieve: pct("nieve", NIEVE),
    clima: pct("clima", CLIMA),
    trabajo: pct("trabajo", cfg.trabajo.map(t=>t.label)),
    fundamentos: fundamentosPct,
    educativasCount: educativas.length,
    totalCurvas: credited.reduce((sum,s)=>sum+(s.totalCurvas||0),0),
    totalSesiones: credited.length,
    diasAsistidos: new Set(credited.map(x => x.date)).size,
  };
}

async function handleFirstTimeSetup(){
  if(!setupDraft.masterCode.trim()){ authError = "Define un código para el jefe de entrenadores."; render(); return; }
  authError = "";
  try{
    const row = await sbUpdate("access_config", {id:1}, {master_code: setupDraft.masterCode, category_codes: setupDraft.categoryCodes});
    accessConfig = { masterCode: row.master_code, categoryCodes: row.category_codes, directorioCode: row.directorio_code || "" };
  }catch(e){ authError = "No se pudo guardar: " + e.message; render(); return; }
  authState = {level:"master"};
  persistAuth();
  render();
}
function handleLogin(){
  const code = pinInput.trim();
  if(!code){ authError = "Ingresa tu código de acceso."; render(); return; }
  if(accessConfig.directorioCode && code === accessConfig.directorioCode){
    authState = {level:"directorio"}; persistAuth(); pinInput=""; authError="";
    if(tab === "daily") initDailyForm();
    render(); return;
  }
  if(code === accessConfig.masterCode){
    authState = {level:"master"}; persistAuth(); pinInput=""; authError="";
    if(tab === "daily") initDailyForm();
    render(); return;
  }
  const matches = [];
  for(const program of PROGRAMS){
    const cats = accessConfig.categoryCodes[program] || {};
    for(const category of Object.keys(cats)){
      const codes = Array.isArray(cats[category]) ? cats[category] : [cats[category]];
      if(codes.includes(code)) matches.push({program, category});
    }
  }
  if(matches.length){
    const first = matches[0];
    authState = {
      level:"category", program: first.program, category: first.category, trainerCode: code,
      isCoordinator: COORDINATOR_CODES.includes(code), accessibleGroups: matches,
    };
    persistAuth(); pinInput=""; authError="";
    currentProgram = first.program;
    const g = ensureCategoryGroup(first.program, first.category);
    selectedGroupId = g.id;
    if(tab === "daily") initDailyForm();
    render(); return;
  }
  authError = "Código incorrecto.";
  render();
}
function handleLogout(){
  authState = null; persistAuth(); pinInput=""; tab="daily"; headerMenuOpen=false; render();
}

async function changeMyCode(newCodeRaw){
  const newCode = (newCodeRaw||"").trim();
  if(!newCode){ changeCodeError = "Ingresa una clave nueva."; render(); return; }

  const oldCode = authState.level === "master" ? accessConfig.masterCode : authState.trainerCode;
  if(newCode === oldCode){ changeCodeError = "Esa ya es tu clave actual."; render(); return; }

  // uniqueness check across master + all category codes
  const allCodes = [accessConfig.masterCode];
  PROGRAMS.forEach(p => { Object.values(accessConfig.categoryCodes[p]||{}).forEach(arr => allCodes.push(...(Array.isArray(arr)?arr:[arr]))); });
  if(allCodes.includes(newCode)){ changeCodeError = "Esa clave ya la está usando otra persona. Elige otra."; render(); return; }

  changeCodeSaving = true; changeCodeError = ""; render();

  try{
    const newCategoryCodes = JSON.parse(JSON.stringify(accessConfig.categoryCodes));
    let newMasterCode = accessConfig.masterCode;

    if(authState.level === "master"){
      newMasterCode = newCode;
    } else {
      const arr = newCategoryCodes[authState.program][authState.category];
      const idx = arr.indexOf(oldCode);
      if(idx >= 0) arr[idx] = newCode;
    }

    // rename in coordinator map: as a key (this person's own mapping) and as a value (people who report to this person)
    const newCoordinatorMap = {};
    Object.entries(COORDINATOR_MAP).forEach(([k,v]) => {
      const key = k === oldCode ? newCode : k;
      const val = v === oldCode ? newCode : v;
      newCoordinatorMap[key] = val;
    });

    const savedConfig = await sbUpdate("access_config", {id:1}, { master_code: newMasterCode, category_codes: newCategoryCodes, coordinator_map: newCoordinatorMap, directorio_code: accessConfig.directorioCode || null });
    accessConfig = { masterCode: savedConfig.master_code, categoryCodes: savedConfig.category_codes, directorioCode: savedConfig.directorio_code || "" };
    COORDINATOR_MAP = savedConfig.coordinator_map;
    COORDINATOR_CODES = Array.from(new Set(Object.values(COORDINATOR_MAP).filter(v => v !== "JEFE")));

    // migrate historical checkin data tied to the old code
    if(authState.level !== "master"){
      try{ await sbUpdate("weekly_checkins", { trainer_code: oldCode }, { trainer_code: newCode }); }catch(e){}
      try{ await sbUpdate("checkin_audit_log", { trainer_code: oldCode }, { trainer_code: newCode }); }catch(e){}
      weeklyCheckins.forEach(c => { if(c.trainerCode === oldCode) c.trainerCode = newCode; });
      checkinAuditLog.forEach(c => { if(c.trainerCode === oldCode) c.trainerCode = newCode; });
      authState = { ...authState, trainerCode: newCode, isCoordinator: COORDINATOR_CODES.includes(newCode) };
    }
    persistAuth();
    changeCodeSuccess = true;
    changeCodeNew = ""; changeCodeConfirm = "";
    showChangeCode = false;
  }catch(e){
    changeCodeError = "No se pudo cambiar la clave. Detalle: " + e.message;
  }
  changeCodeSaving = false;
  render();
}

function initDailyForm(){
  if(!selectedGroupId) return;
  justSaved = false;
  const gAthletes = groupAthletes();
  attendanceState = {};
  gAthletes.forEach(a => {
    const rec = attendance.find(r => r.athleteId === a.id && r.date === selectedDate);
    attendanceState[a.id] = rec ? rec.present : true;
  });
  const daySessions = sessions.filter(s => s.groupId === selectedGroupId && s.date === selectedDate);
  sessionCount = daySessions.length ? Math.max(...daySessions.map(s=>s.sessionNumber)) : 1;
  sessionState = {};
  for(let i=1;i<=sessionCount;i++){
    const existing = daySessions.find(s => s.sessionNumber === i);
    sessionState[i] = existing ? {
      disciplina:existing.disciplina, nieve:existing.nieve, clima:existing.clima, trabajo:existing.trabajo,
      fundamentos: existing.fundamentos || [], curvasPorBajada:existing.curvasPorBajada, bajadas:existing.bajadas, notas:existing.notas, trazado:existing.trazado||null
    } : blankSessionForm();
  }
}
/* ============ CUSTOM CALENDAR ============ */
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS_SEMANA = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const DIAS_LARGO = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];

function formatFechaLarga(ds){
  const [y,m,d] = ds.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  return `${DIAS_LARGO[dt.getDay()]} ${d} de ${MESES[m-1]}`;
}

function dstr(y,m,d){ return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }

function changeCalendarMonth(delta){
  calendarViewMonth = new Date(calendarViewMonth.getFullYear(), calendarViewMonth.getMonth()+delta, 1);
  render();
}

}

      <span class="date-label">📅 ${formatFechaLarga(selectedDate)}${isToday?` <span class="today-chip">Hoy</span>`:""}</span>

function calendarBodyHTML(){
  if(!calendarViewMonth){
    const [y,m] = selectedDate.split("-").map(Number);
    calendarViewMonth = new Date(y, m-1, 1);
  }
  const year = calendarViewMonth.getFullYear();
  const month = calendarViewMonth.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const startOffset = (firstOfMonth.getDay() + 6) % 7; // Monday = 0
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();

  const today = new Date();
  const todayStr = dstr(today.getFullYear(), today.getMonth(), today.getDate());

  const datesWithData = new Set();
  sessions.forEach(s => { if(s.groupId === selectedGroupId) datesWithData.add(s.date); });
  attendance.forEach(a => { if(a.groupId === selectedGroupId) datesWithData.add(a.date); });

  let cells = "";
  for(let i=0;i<startOffset;i++){
    const d = daysInPrevMonth - startOffset + i + 1;
    const py = month===0? year-1 : year, pm = month===0? 11 : month-1;
    cells += `<button type="button" class="cal-day other-month" data-date="${dstr(py,pm,d)}">${d}</button>`;
  }
  for(let d=1; d<=daysInMonth; d++){
    const ds = dstr(year, month, d);
    const classes = ["cal-day"];
    if(ds === todayStr) classes.push("today");
    if(ds === selectedDate) classes.push("selected");
    if(datesWithData.has(ds)) classes.push("has-data");
    cells += `<button type="button" class="${classes.join(" ")}" data-date="${ds}">${d}</button>`;
  }
  const totalCells = startOffset + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for(let d=1; d<=trailing; d++){
    const ny = month===11? year+1 : year, nm = month===11? 0 : month+1;
    cells += `<button type="button" class="cal-day other-month" data-date="${dstr(ny,nm,d)}">${d}</button>`;
  }

  return `
  <div class="cal-body">
    <div class="cal-head">
      <button type="button" class="cal-nav-btn" id="cal-prev-btn">‹</button>
      <span class="label">${MESES[month]} ${year}</span>
      <button type="button" class="cal-nav-btn" id="cal-next-btn">›</button>
    </div>
    <div class="cal-weekdays">${DIAS_SEMANA.map(d=>`<span>${d}</span>`).join("")}</div>
    <div class="cal-grid">${cells}</div>
    <button type="button" class="cal-today-btn" id="cal-today-btn">Hoy</button>
  </div>`;
}

function changeSessionCount(delta){
  const savedNums = sessions.filter(s=>s.groupId===selectedGroupId && s.date===selectedDate).map(s=>s.sessionNumber);
  const minCount = savedNums.length ? Math.max(...savedNums) : 1;
  let next = sessionCount + delta;
  if(next < minCount) next = minCount;
  if(next < 1) next = 1;
  if(next > sessionCount){ for(let i=sessionCount+1;i<=next;i++){ if(!sessionState[i]) sessionState[i] = blankSessionForm(); } }
  sessionCount = next;
  render();
}
async function saveDay(){
  saveDayError = "";
  justSaved = false;
  const cfgForValidation = configForGroup(selectedGroupId);
  // Si no asistió nadie, no hubo sesión que describir: se guarda sin detalles
  const delGrupo = groupAthletes();
  const nadiePresente = delGrupo.length > 0 && delGrupo.every(a => !attendanceState[a.id]);
  
  // PERMITIR: si nadie está presente, se guarda sin validar sesiones
  // VALIDAR: solo si hay al menos un atleta presente
  if(!nadiePresente) {
    for(let i=1;i<=sessionCount;i++){
      const s = sessionState[i];
      const needsDisciplina = cfgForValidation.disciplinas.length > 0;
      if(!s || (needsDisciplina && !s.disciplina) || !s.nieve || !s.clima || !s.trabajo){
        saveDayError = needsDisciplina
          ? `Completa disciplina, nieve, clima y trabajo realizado en la Sesión ${i} (o reduce el número de sesiones).`
          : `Completa tipo de nieve, clima y trabajo realizado en la Sesión ${i} (o reduce el número de sesiones).`;
        render(); return;
      }
    }
  }
  saving = true; render();

  try{
    const attRows = groupAthletes().map(a => ({ athlete_id: a.id, group_id: selectedGroupId, date: selectedDate, present: !!attendanceState[a.id], status: attendanceState[a.id] ? "present" : "absent", period: classifyPeriod(selectedDate) }));
    if(attRows.length){
      const savedAtt = await sbInsert("attendance", attRows, {onConflict:"athlete_id,date", merge:true});
      const savedAttArr = Array.isArray(savedAtt) ? savedAtt : [savedAtt];
      savedAttArr.forEach(row => {
        const mapped = mapAttendance(row);
        const idx = attendance.findIndex(x => x.athleteId===mapped.athleteId && x.date===mapped.date);
        if(idx>=0) attendance[idx]=mapped; else attendance.push(mapped);
      });
    }

    const sessRows = [];
    if(!nadiePresente) for(let i=1;i<=sessionCount;i++){
      const s = sessionState[i];
      const totalCurvas = (s.curvasPorBajada||0) * (s.bajadas||0);
      sessRows.push({
        group_id: selectedGroupId, date: selectedDate, session_number: i,
        disciplina: s.disciplina, nieve: s.nieve, clima: s.clima, trabajo: s.trabajo,
        fundamentos: s.trabajo==="Ejercicios educativos" ? (s.fundamentos||[]) : [],
        curvas_por_bajada: s.curvasPorBajada||0, bajadas: s.bajadas||0, total_curvas: totalCurvas,
        notas: (s.notas||"").trim(), trazado: s.trazado || null
      });
    }
    if(sessRows.length){
      const savedSess = await sbInsert("sessions", sessRows, {onConflict:"group_id,date,session_number", merge:true});
      const savedSessArr = Array.isArray(savedSess) ? savedSess : [savedSess];
      savedSessArr.forEach(row => {
        const mapped = mapSession(row);
        const idx = sessions.findIndex(x => x.groupId===mapped.groupId && x.date===mapped.date && x.sessionNumber===mapped.sessionNumber);
        if(idx>=0) sessions[idx]=mapped; else sessions.push(mapped);
      });
    }

    justSaved = true;
  }catch(e){
    saveDayError = `No se pudo guardar el día. Detalle: ${e.message}. Vuelve a intentarlo; si persiste, dime exactamente este texto.`;
  }
  saving = false;
  render();
}

  saveDayError = "";

  try{
    await sbDelete("attendance", { group_id: selectedGroupId, date: selectedDate });
    await sbDelete("sessions", { group_id: selectedGroupId, date: selectedDate });

    initDailyForm();
  }catch(e){
    saveDayError = `No se pudo borrar el registro. Detalle: ${e.message}. Vuelve a intentarlo; si persiste, dime exactamente este texto.`;
  }
  saving = false;
  render();
}

async function removeTrainer(id){
  const trainer = trainers.find(t => t.id === id);
  const confirmed = confirm(`¿Eliminar a ${trainer?.name||"este entrenador"} de la lista? Se borra también su historial de asistencia.`);
  if(!confirmed) return;
  try{
    await sbDelete("trainers", { id });
    trainers = trainers.filter(t => t.id !== id);
    trainerAttendance = trainerAttendance.filter(r => r.trainerId !== id);
    render();
  }catch(e){ alert("No se pudo eliminar: " + e.message); }
}
async function saveTrainerAttendance(){
  trainerSaveError = "";
  trainerSaving = true; render();
  try{
    // Preservar estados "día libre" y "sin entrenamiento" (individuales o del día completo):
    // esos registros NO deben convertirse en presente/ausente, para que no cuenten en el total del %.
    const rows = trainers.map(t => {
      const est = estadoEntrenador(t.id);
      const mantieneEstado = est === "free_day" || est === "no_training";
      return {
        trainer_id: t.id,
        date: trainerAttDate,
        present: mantieneEstado ? false : !!trainerAttendanceState[t.id],
        status: mantieneEstado ? est : (trainerAttendanceState[t.id] ? "present" : "absent"),
        period: classifyPeriod(trainerAttDate)
      };
    });
    if(rows.length){
      const saved = await sbInsert("trainer_attendance", rows, {onConflict:"trainer_id,date", merge:true});
      const savedArr = Array.isArray(saved) ? saved : [saved];
      savedArr.forEach(row => {
        const mapped = mapTrainerAttendance(row);
        const idx = trainerAttendance.findIndex(x => x.trainerId===mapped.trainerId && x.date===mapped.date);
        if(idx>=0) trainerAttendance[idx]=mapped; else trainerAttendance.push(mapped);
      });
    }
    trainerJustSaved = true;
  }catch(e){
    trainerSaveError = `No se pudo guardar. Detalle: ${e.message}.`;
  }
  trainerSaving = false;
  render();
}
function trainerStats(trainerId){
  // Los dias libres y sin entrenamiento NO entran en el total
  const recs = trainerAttendance.filter(r => r.trainerId === trainerId
    && (r.status === "present" || r.status === "absent"));
  const total = recs.length;
  const present = recs.filter(r => r.status === "present").length;
  return { total, present, pct: total ? Math.round((present/total)*100) : 0 };
}

function trainerCalendarBodyHTML(){
  if(!trainerCalViewMonth){
    const [y,m] = trainerAttDate.split("-").map(Number);
    trainerCalViewMonth = new Date(y, m-1, 1);
  }
  const year = trainerCalViewMonth.getFullYear();
  const month = trainerCalViewMonth.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const startOffset = (firstOfMonth.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const today = new Date();
  const todayStr = dstr(today.getFullYear(), today.getMonth(), today.getDate());

  const datesWithData = new Set(trainerAttendance.map(r => r.date));

  let cells = "";
  for(let i=0;i<startOffset;i++){
    const d = daysInPrevMonth - startOffset + i + 1;
    const py = month===0? year-1 : year, pm = month===0? 11 : month-1;
    cells += `<button type="button" class="cal-day other-month" data-tdate="${dstr(py,pm,d)}">${d}</button>`;
  }
  for(let d=1; d<=daysInMonth; d++){
    const ds = dstr(year, month, d);
    const classes = ["cal-day"];
    if(ds === todayStr) classes.push("today");
    if(ds === trainerAttDate) classes.push("selected");
    if(datesWithData.has(ds)) classes.push("has-data");
    if(classifyPeriod(ds) !== filterPeriod) classes.push("fuera-periodo");
    const delDia = trainerAttendance.filter(r => r.date === ds);
    if(delDia.length){
      const cuentan = delDia.filter(r => r.status === "present" || r.status === "absent");
      const pres = delDia.filter(r => r.status === "present").length;
      if(!cuentan.length) classes.push("att-libre");
      else if(pres === cuentan.length) classes.push("att-full");
      else if(pres === 0) classes.push("att-none");
      else classes.push("att-part");
    }
    cells += `<button type="button" class="${classes.join(" ")}" data-tdate="${ds}">${d}</button>`;
  }
  const totalCells = startOffset + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for(let d=1; d<=trailing; d++){
    const ny = month===11? year+1 : year, nm = month===11? 0 : month+1;
    cells += `<button type="button" class="cal-day other-month" data-tdate="${dstr(ny,nm,d)}">${d}</button>`;
  }
  return `
  <div class="cal-body">
    <div class="cal-head">
      <button type="button" class="cal-nav-btn" id="trainer-cal-prev-btn">‹</button>
      <span class="label">${MESES[month]} ${year}</span>
      <button type="button" class="cal-nav-btn" id="trainer-cal-next-btn">›</button>
    </div>
    <div class="cal-weekdays">${DIAS_SEMANA.map(d=>`<span>${d}</span>`).join("")}</div>
    <div class="cal-grid">${cells}</div>
    <button type="button" class="cal-today-btn" id="trainer-cal-today-btn">Hoy</button>
  </div>`;
}

function mondayOf(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  const day = (d.getDay() + 6) % 7; // Monday = 0
  d.setDate(d.getDate() - day);
  return dstr(d.getFullYear(), d.getMonth(), d.getDate());
}
function addDaysToDateStr(dateStr, days){
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + days);
  return dstr(d.getFullYear(), d.getMonth(), d.getDate());
}
function weekRangeLabel(weekStart){
  const start = new Date(weekStart + "T00:00:00");
  const end = new Date(addDaysToDateStr(weekStart, 6) + "T00:00:00");
  const fmt = (d) => d.toLocaleDateString("es-ES", { day:"2-digit", month:"short" }).replace(".","");
  return `${fmt(start)} – ${fmt(end)}`;
}

    const mapped = {id:saved.id, groupId:saved.group_id, trainerCode:saved.trainer_code, weekStart:saved.week_start, q1:saved.q1, q2:saved.q2, q3:saved.q3, q4:saved.q4, q5:saved.q5, q6:saved.q6, sentToJefe:!!saved.sent_to_jefe, sentAt:saved.sent_at};

}

function initTransportForm(){
  const existing = trainerTransport.find(t => t.trainerCode === authState.trainerCode && t.date === transportDate);
  transportUsed = !!existing;
  transportNumTrainers = existing ? existing.numTrainers : 1;
  transportJustSaved = false;
  transportSaveError = "";
}
function toggleTransportCalendar(){
  transportCalOpen = !transportCalOpen;
  if(transportCalOpen){
    const [y,m] = transportDate.split("-").map(Number);
    transportCalViewMonth = new Date(y, m-1, 1);
  }
  render();
}
function changeTransportCalendarMonth(delta){
  transportCalViewMonth = new Date(transportCalViewMonth.getFullYear(), transportCalViewMonth.getMonth()+delta, 1);
  render();
}
function selectTransportCalendarDay(dateStr){
  transportDate = dateStr;
  transportCalOpen = false;
  initTransportForm();
  render();
}
function goToTodayTransport(){
  transportDate = todayISO();
  initTransportForm();
  render();
}
async function saveTransport(){
  transportSaveError = ""; transportSaving = true; render();
  try{
    if(transportUsed){
      const row = { trainer_code: authState.trainerCode, date: transportDate, num_trainers: transportNumTrainers || 1 };
      const saved = await sbInsert("trainer_transport", row, {onConflict:"trainer_code,date", merge:true});
      const mapped = {id:saved.id, trainerCode:saved.trainer_code, date:saved.date, numTrainers:saved.num_trainers};
      const idx = trainerTransport.findIndex(t => t.trainerCode===mapped.trainerCode && t.date===mapped.date);
      if(idx>=0) trainerTransport[idx]=mapped; else trainerTransport.push(mapped);
    } else {
      const existing = trainerTransport.find(t => t.trainerCode === authState.trainerCode && t.date === transportDate);
      if(existing){
        await sbDelete("trainer_transport", { id: existing.id });
        trainerTransport = trainerTransport.filter(t => t.id !== existing.id);
      }
    }
    transportJustSaved = true;
  }catch(e){
    transportSaveError = "No se pudo guardar. Detalle: " + e.message;
  }
  transportSaving = false;
  render();
}

function transportCalendarBodyHTML(){
  if(!transportCalViewMonth){
    const [y,m] = transportDate.split("-").map(Number);
    transportCalViewMonth = new Date(y, m-1, 1);
  }
  const year = transportCalViewMonth.getFullYear();
  const month = transportCalViewMonth.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const startOffset = (firstOfMonth.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const today = new Date();
  const todayStr = dstr(today.getFullYear(), today.getMonth(), today.getDate());

  let cells = "";
  for(let i=0;i<startOffset;i++){
    const d = daysInPrevMonth - startOffset + i + 1;
    const py = month===0? year-1 : year, pm = month===0? 11 : month-1;
    cells += `<button type="button" class="cal-day other-month" data-tdate="${dstr(py,pm,d)}">${d}</button>`;
  }
  for(let d=1; d<=daysInMonth; d++){
    const ds = dstr(year, month, d);
    const classes = ["cal-day"];
    if(ds === todayStr) classes.push("today");
    if(ds === transportDate) classes.push("selected");
    cells += `<button type="button" class="${classes.join(" ")}" data-tdate="${ds}">${d}</button>`;
  }
  const totalCells = startOffset + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for(let d=1; d<=trailing; d++){
    const ny = month===11? year+1 : year, nm = month===11? 0 : month+1;
    cells += `<button type="button" class="cal-day other-month" data-tdate="${dstr(ny,nm,d)}">${d}</button>`;
  }
  return `
  <div class="cal-body">
    <div class="cal-head">
      <button type="button" class="cal-nav-btn" id="transport-cal-prev-btn">‹</button>
      <span class="label">${MESES[month]} ${year}</span>
      <button type="button" class="cal-nav-btn" id="transport-cal-next-btn">›</button>
    </div>
    <div class="cal-weekdays">${DIAS_SEMANA.map(d=>`<span>${d}</span>`).join("")}</div>
    <div class="cal-grid">${cells}</div>
    <button type="button" class="cal-today-btn" id="transport-cal-today-btn">Hoy</button>
  </div>`;
}

function allTrainerCodes(){
  const set = new Set();
  const cc = (accessConfig && accessConfig.categoryCodes) || {};
  Object.values(cc).forEach(cats => Object.values(cats || {}).forEach(arr =>
    (arr || []).forEach(c => { if(c) set.add(c); })));
  Object.keys(COORDINATOR_MAP || {}).forEach(c => set.add(c));
  trainerTransport.forEach(t => { if(t.trainerCode) set.add(t.trainerCode); });
  return Array.from(set).sort((a,b)=>a.localeCompare(b));
}

  const shared = trainerTransport.filter(t => (t.numTrainers||0) >= 2);
  let html = `<div class="card">
    <div class="section-label"><div class="gate-poles"><span></span><span></span></div><span class="title">Viajes compartidos — historial</span></div>
    <div style="font-size:12px;color:${GRAY};margin-bottom:16px;">Solo días con 2 o más personas por auto.</div>`;

  if(!shared.length){
    html += `<div style="font-size:13px;color:${GRAY};text-align:center;padding:16px 0;">Aún no hay viajes compartidos registrados.</div></div>`;
    return html;
  }

  // Agregado por entrenador
  const by = {};
  shared.forEach(t => {
    if(!by[t.trainerCode]) by[t.trainerCode] = { viajes:0, personas:0, dist:{} };
    by[t.trainerCode].viajes += 1;
    by[t.trainerCode].personas += t.numTrainers;
    by[t.trainerCode].dist[t.numTrainers] = (by[t.trainerCode].dist[t.numTrainers]||0) + 1;
  });
  const filas = Object.keys(by).map(c => ({ code:c, ...by[c] })).sort((a,b)=> b.viajes - a.viajes);
  const maxViajes = Math.max(...filas.map(f=>f.viajes));
  const totalViajes = shared.length;
  const totalPersonas = shared.reduce((s,t)=>s+t.numTrainers,0);

  html += `<div class="panel inner">
    <button type="button" class="panel-toggle" id="trips-stats-toggle">
      <span class="panel-title">Resumen general</span>
      <span class="panel-meta"><span class="chev">${tripsStatsOpen?"▴":"▾"}</span></span>
    </button>
    ${tripsStatsOpen ? `<div class="panel-body">
      <div class="mini-stats">
        <div><span class="ms-val">${totalViajes}</span><span class="ms-lbl">Viajes compartidos</span></div>
        <div><span class="ms-val">${totalPersonas}</span><span class="ms-lbl">Personas movilizadas</span></div>
        <div><span class="ms-val">${(totalPersonas/totalViajes).toFixed(1)}</span><span class="ms-lbl">Promedio por auto</span></div>
      </div>
    </div>` : ""}
  </div>`;

  // Barras horizontales por entrenador
  const PAL = { 2:"#3E92CC", 3:"#2E8B57", 4:"#C9A227", 5:"#D1495B", 6:"#7B4BC9" };
  html += `<div class="trips-chart">`;
  filas.forEach(f => {
    const pct = Math.round((f.viajes / maxViajes) * 100);
    const segs = Object.keys(f.dist).map(Number).sort((a,b)=>a-b);
    html += `<div class="trip-row">
      <div class="trip-head">
        <span class="trip-name">${escapeHtml(f.code)}</span>
        <span class="trip-num">${f.viajes} ${f.viajes===1?"viaje":"viajes"} · ${f.personas} pers.</span>
      </div>
      <div class="trip-track" style="width:${pct}%;">
        ${segs.map(n => `<div class="trip-seg" style="flex:${f.dist[n]};background:${PAL[n]||"#8D8D8D"};" title="${f.dist[n]}× con ${n} personas">${f.dist[n]>=2?f.dist[n]:""}</div>`).join("")}
      </div>
    </div>`;
  });
  html += `</div>`;

  // Leyenda
  const usados = Array.from(new Set(shared.map(t=>t.numTrainers))).sort((a,b)=>a-b);
  html += `<div class="trip-legend">${usados.map(n =>
    `<span class="trip-leg-item"><i style="background:${PAL[n]||"#8D8D8D"}"></i>${n} personas</span>`).join("")}</div>`;

  html += `</div>`;
  return html;
}

/* ============ EXPORT ============ */
function buildDaySummaryText(){
  const group = groups.find(g => g.id === selectedGroupId);
  const cfg = configForGroup(selectedGroupId);
  const gAthletes = groupAthletes();
  const present = gAthletes.filter(a => attendanceState[a.id]);
  const absent = gAthletes.filter(a => !attendanceState[a.id]);
  let text = `🎿 ${group?.program||""} — ${group?.name||""} — ${selectedDate}\n\n`;
  text += `Asistencia: ${present.length}/${gAthletes.length} presentes\n`;
  if(present.length) text += `Presentes: ${present.map(a=>a.name).join(", ")}\n`;
  if(absent.length) text += `Ausentes: ${absent.map(a=>a.name).join(", ")}\n`;
  text += `\n`;
  for(let i=1;i<=sessionCount;i++){
    const s = sessionState[i];
    if(!s || !s.nieve) continue;
    const total = (s.curvasPorBajada||0) * (s.bajadas||0);
    text += `— Sesión ${i} —\n`;
    if(s.disciplina) text += `Disciplina: ${s.disciplina}\n`;
    text += `Tipo de nieve: ${s.nieve}\n`;
    text += `Clima: ${s.clima}\n`;
    text += `Trabajo realizado: ${s.trabajo}\n`;
    if(s.fundamentos && s.fundamentos.length) text += `Fundamentos: ${s.fundamentos.join(", ")}\n`;
    if(cfg.hasCurvas){
      text += `Curvas por bajada: ${s.curvasPorBajada||0}\n`;
      text += `Cantidad de bajadas: ${s.bajadas||0}\n`;
      text += `Total de curvas: ${total}\n`;
    } else {
      text += `Cantidad de bajadas: ${s.bajadas||0}\n`;
    }
    if(s.notas && s.notas.trim()) text += `Observaciones: ${s.notas.trim()}\n`;
    if(s.trazado) text += `🖼️ Trazado dibujado adjunto\n`;
    text += `\n`;
  }
  return text.trim();
}
async function shareToWhatsApp(){
  const text = buildDaySummaryText();
  const files = [];
  for(let i=1;i<=sessionCount;i++){
    const s = sessionState[i];
    if(s && s.trazado){
      try{
        const blob = await (await fetch(s.trazado)).blob();
        files.push(new File([blob], `trazado_sesion_${i}.png`, {type:"image/png"}));
      }catch(e){}
    }
  }
  if(files.length && navigator.canShare && navigator.canShare({ files })){
    try{
      await navigator.share({ text, files });
      return;
    }catch(e){ /* el usuario canceló o el navegador falló: seguimos con el link de texto */ }
  }
  window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, "_blank");
}

function exportExcel(){
  const group = groups.find(g => g.id === selectedGroupId);
  const dates = Array.from(new Set(attendance.filter(r=>r.groupId===selectedGroupId).map(r=>r.date))).sort();
  const attSheet = [["Integrante", ...dates]];
  groupAthletes().forEach(a => {
    const row = [a.name];
    dates.forEach(d => { const rec = attendance.find(r=>r.athleteId===a.id && r.date===d); row.push(rec ? (rec.present?"Presente":"Ausente") : ""); });
    attSheet.push(row);
  });
  const summarySheet = [["Integrante","Teléfono","% En pistas","% Pre temporada","Días entrenados","Sesiones acreditadas","Total curvas","Disciplina más practicada","Trabajo más practicado","Fundamento más trabajado"]];
  groupAthletes().forEach(a => {
    const st = athleteStats(a.id, selectedGroupId);
    const topDisc = [...st.disciplina].sort((x,y)=>y.value-x.value)[0];
    const topTrab = [...st.trabajo].sort((x,y)=>y.value-x.value)[0];
    const topFund = [...st.fundamentos].sort((x,y)=>y.value-x.value)[0];
    const sp = athletePeriodStats(a.id, "temporada_26");
    const sr = athletePeriodStats(a.id, "pre_temporada");
    summarySheet.push([a.name, a.phone||"—",
      sp.pct===null?"—":`${sp.pct}% (${sp.present}/${sp.total})`,
      sr.pct===null?"—":`${sr.pct}% (${sr.present}/${sr.total})`,
      st.diasAsistidos, st.totalSesiones, st.totalCurvas,
      topDisc && topDisc.value>0 ? `${topDisc.name} (${topDisc.value}%)` : "—",
      topTrab && topTrab.value>0 ? `${topTrab.name} (${topTrab.value}%)` : "—",
      topFund && topFund.value>0 ? `${topFund.name} (${topFund.value}%)` : "—"]);
  });
  const fichaSheet = [["Integrante","Teléfono","Enfermedades relevantes","Alergias","Medicamentos permanentes","Otros","Notas adicionales"]];
  groupAthletes().forEach(a => {
    const m = a.medical || blankFicha();
    fichaSheet.push([a.name, a.phone||"—", m.enfermedades||"—", m.alergias||"—", m.medicamentos||"—", m.otros||"—", a.notas||"—"]);
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(attSheet), "Asistencia");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summarySheet), "Resumen por integrante");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(fichaSheet), "Fichas médicas");
  XLSX.writeFile(wb, `entrenamiento_${(group?.name||"grupo").replace(/\s+/g,"_")}_${todayISO()}.xlsx`);
}
function copySummary(){
  const group = groups.find(g => g.id === selectedGroupId);
  let text = `Resumen — ${group?.name||""} (al ${todayISO()})\n\n`;
  groupAthletes().forEach(a => {
    const st = athleteStats(a.id, selectedGroupId);
    const sp = athletePeriodStats(a.id, "temporada_26");
    text += `• ${a.name}: ${sp.pct===null?"—":sp.pct+"%"} en pistas (${sp.present}/${sp.total}), ${st.diasAsistidos} días entrenados, ${st.totalCurvas} curvas totales\n`;
  });
  navigator.clipboard.writeText(text).then(()=>{ alert("Resumen copiado al portapapeles."); });
}

function exportBackupCompleto(){
  const XLSX = window.XLSX;
  if(!XLSX){ alert("No se pudo cargar el generador de Excel. Revisa tu conexión."); return; }
  const wb = XLSX.utils.book_new();
  const hoja = (nombre, filas) => XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(filas), nombre);
  const gDe = id => { const g = groups.find(x => x.id === id); return g ? `${g.program} · ${g.name}` : ""; };
  const nDe = id => { const a = athletes.find(x => x.id === id); return a ? a.name : ""; };
  const tDe = id => { const t = trainers.find(x => x.id === id); return t ? t.name : ""; };
  const ETIQ = {present:"Presente", absent:"Ausente", no_training:"Sin entrenamiento", free_day:"Día libre"};
  const PER  = {pre_temporada:"Pre temporada", temporada_26:"En pistas"};

  hoja("Integrantes", [["Programa","Grupo","Integrante","Teléfono","Enfermedades","Alergias","Medicamentos","Otros","Notas adicionales"]]
    .concat(athletes.map(a => { const m = a.medical || {}; const g = groups.find(x => x.id === a.groupId) || {};
      return [g.program||"", g.name||"", a.name, a.phone||"", m.enfermedades||"", m.alergias||"", m.medicamentos||"", m.otros||"", a.notas||""]; })));

  hoja("Asistencia atletas", [["Integrante","Grupo","Fecha","Período","Estado","Notas"]]
    .concat(attendance.map(r => [nDe(r.athleteId), gDe(r.groupId), r.date, PER[r.period]||r.period, ETIQ[r.status]||r.status, r.notes||""])));

  hoja("Asistencia entrenadores", [["Entrenador","Fecha","Período","Estado","Notas"]]
    .concat(trainerAttendance.map(r => [tDe(r.trainerId), r.date, PER[r.period]||r.period, ETIQ[r.status]||r.status, r.notes||""])));

  hoja("Sesiones", [["Grupo","Fecha","Disciplina","Trabajo","Fundamentos","Nieve","Clima","Total curvas"]]
    .concat(sessions.map(x => [gDe(x.groupId), x.date, x.disciplina||"", x.trabajo||"",
      Array.isArray(x.fundamentos)? x.fundamentos.join(", ") : (x.fundamentos||""), x.nieve||"", x.clima||"", x.totalCurvas||0])));

  hoja("Transporte", [["Fecha","Entrenador","Personas en el auto","¿Compartido?"]]
    .concat(trainerTransport.slice().sort((a,b)=> a.date<b.date?-1:1)
      .map(t => [t.date, t.trainerCode, t.numTrainers, (t.numTrainers>=2?"Sí":"No")])));

  hoja("Pulso semanal", [["Semana","Entrenador","Grupo","Progreso técnico","Obstáculos","Qué funcionó","Motivación","Material","Comunicación","Enviado al jefe"]]
    .concat(weeklyCheckins.map(c => [c.weekStart, c.trainerCode, gDe(c.groupId),
      c.q1||"", c.q2||"", c.q3||"", c.q4||"", c.q5||"", c.q6||"", c.sentToJefe?"Sí":"No"])));

  hoja("Entrenadores", [["Entrenador"]].concat(trainers.map(t => [t.name])));
  hoja("Grupos", [["Programa","Grupo","Integrantes"]]
    .concat(groups.map(g => [g.program, g.name, athletes.filter(a => a.groupId===g.id).length])));

  hoja("Resumen", [
    ["Respaldo generado", new Date().toLocaleString("es-CL")],
    ["Versión de la app", APP_VERSION], [],
    ["Tabla","Registros"],
    ["Integrantes", athletes.length], ["Asistencia atletas", attendance.length],
    ["Asistencia entrenadores", trainerAttendance.length], ["Sesiones", sessions.length],
    ["Transporte", trainerTransport.length], ["Pulso semanal", weeklyCheckins.length],
    ["Entrenadores", trainers.length], ["Grupos", groups.length],
  ]);

  XLSX.writeFile(wb, `CEC26_respaldo_completo_${todayISO()}.xlsx`);
  ultimoRespaldo = new Date().toISOString();
  lsSet(K_RESPALDO, ultimoRespaldo);
  render();
}

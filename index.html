<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sistema de entrenamiento y asistencia — Esquí</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#0B2545; --red:#E5383B; --blue:#3E92CC; --snow:#F7FAFC;
    --gray:#8D99AE; --gold:#FFB703; --green:#2E8B57; --border:#D7DEE7;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--snow); font-family:'Inter',sans-serif; color:#3A4658;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  .hero{background:var(--navy); padding:20px 20px 24px; position:relative; overflow:hidden;}
  .hero .gates{position:absolute; top:0; right:0; height:100%; display:flex; gap:6px; padding-right:12px; opacity:.4;}
  .hero .gates div{width:5px;}
  .eyebrow{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.2em; font-size:12px; color:var(--gold); margin-bottom:4px;}
  .hero-title{font-family:'Oswald',sans-serif; font-weight:700; color:white; font-size:1.7rem; line-height:1.1;}
  .hero-sub{color:#B8C4D9; font-size:13px; margin-top:2px;}
  .hero-top-row{display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:8px;}
  .role-badges{display:flex; gap:8px; flex-wrap:wrap;}
  .role-badge{display:flex; align-items:center; gap:5px; font-size:12px; background:#16305C; color:#B8C4D9; border-radius:8px; padding:6px 10px; border:none;}

  .tabs{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .tab-btn{font-size:13px; padding:7px 12px; border-radius:8px; border:none; font-weight:500;}

  .wrap{max-width:720px; margin:-10px auto 0; padding:0 16px 40px;}
  .card{background:white; border-radius:16px; padding:20px; box-shadow:0 10px 30px rgba(11,37,69,.10); margin-bottom:16px;}

  label.field-label{display:block; font-size:12px; color:var(--gray); margin-bottom:6px;}
  input[type="text"], input[type="password"], textarea, input[type="date"]{
    width:100%; border:1px solid var(--border); border-radius:8px; padding:10px 12px;
    font-size:14px; color:var(--navy); outline:none;
  }
  textarea{resize:none;}

  .section-label{display:flex; align-items:center; gap:8px; margin:16px 0 10px;}
  .section-label:first-of-type{margin-top:0;}
  .gate-poles{display:flex; gap:2px;}
  .gate-poles span{display:inline-block; width:4px; height:18px; border-radius:2px;}
  .gate-poles span:nth-child(1){background:var(--red);}
  .gate-poles span:nth-child(2){background:var(--blue);}
  .section-label span.title{font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:13px; letter-spacing:.06em; color:var(--navy);}

  .pills{display:flex; flex-wrap:wrap; gap:8px;}
  .pill{
    font-size:14px; padding:8px 14px; border-radius:8px;
    border:1px solid var(--border); background:white; color:#3A4658;
  }
  .pill.active{color:white; font-weight:600; border-color:transparent; box-shadow:0 2px 8px rgba(11,37,69,.18);}

  .cat-btn{
    display:flex; align-items:center; gap:6px; font-family:'Oswald',sans-serif; text-transform:uppercase;
    font-size:14px; letter-spacing:.04em; padding:9px 14px; border-radius:8px; border:1px solid var(--border); background:white; color:#3A4658;
  }
  .cat-btn.created{border-color:#B8C4D9; color:var(--navy);}
  .cat-btn.selected{background:var(--navy); border-color:var(--navy); color:white;}
  .cat-btn .x{margin-left:2px; opacity:.75;}
  .cat-fixed{
    display:inline-flex; align-items:center; gap:6px; font-family:'Oswald',sans-serif; text-transform:uppercase;
    font-size:14px; letter-spacing:.04em; padding:9px 14px; border-radius:8px; background:var(--navy); color:white;
  }

  .stepper{flex:1; min-width:150px;}
  .stepper .lbl{font-size:12px; color:var(--gray); margin-bottom:6px;}
  .stepper .box{display:flex; align-items:center; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  .stepper button{background:none; border:none; font-family:'JetBrains Mono',monospace; font-size:18px; padding:8px 12px; color:var(--navy);}
  .stepper input{width:100%; text-align:center; border:none; outline:none; font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--navy); padding:8px 0;}
  .steppers{display:flex; flex-wrap:wrap; gap:12px; margin-bottom:12px;}

  .total-box{display:flex; align-items:center; justify-content:space-between; background:var(--navy); border-radius:12px; padding:10px 14px; margin-bottom:12px;}
  .total-box span.lbl{color:#B8C4D9; font-size:13px;}
  .total-box span.val{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:1.4rem; color:var(--gold);}

  .error-box{font-size:13px; background:#FDECEC; color:var(--red); border-radius:8px; padding:8px 12px; margin-bottom:12px;}
  .info-box{font-size:12px; background:#EEF3FA; color:var(--navy); border-radius:8px; padding:8px 12px; margin-bottom:12px;}

  .save-btn{
    width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.05em;
    background:var(--red); color:white; border:none; border-radius:12px; padding:13px; font-size:14px;
  }
  .btn-navy{background:var(--navy); color:white; border:none; border-radius:10px; padding:10px 16px; font-size:13px; display:flex; align-items:center; gap:6px; justify-content:center;}
  .btn-outline{background:white; border:1px solid var(--border); color:#3A4658; border-radius:10px; padding:10px 16px; font-size:13px; display:flex; align-items:center; gap:6px; justify-content:center;}

  select{
    appearance:none; font-size:14px; padding:8px 30px 8px 12px; border-radius:8px; border:1px solid var(--border);
    color:var(--navy); background:white url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%238D99AE"/></svg>') no-repeat right 10px center;
  }

  .athlete-card{border:1px solid #E7ECF2; border-radius:12px; background:#F7FAFC; margin-bottom:10px; overflow:hidden;}
  .athlete-row{display:flex; align-items:center; gap:8px; padding:10px 12px;}
  .athlete-name{flex:1; font-size:14px; font-weight:500; color:var(--navy);}
  .phone-badge{font-size:12px; color:var(--gray); display:flex; align-items:center; gap:4px;}
  .ficha-btn{font-size:12px; padding:5px 9px; border-radius:6px; border:1px solid var(--border); background:white; color:var(--navy); display:flex; align-items:center; gap:4px;}
  .ficha-btn.open{background:var(--navy); color:white;}
  .ficha-body{padding:4px 12px 14px; border-top:1px solid #E7ECF2;}

  .session-card{background:#F7FAFC; border:1px solid #E7ECF2; border-radius:12px; padding:16px; margin-bottom:16px;}
  .fund-box{background:#FFF6E0; border:1px solid #FCE7B0; border-radius:8px; padding:10px 12px; margin-bottom:12px;}

  .stat-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
  .stat-box{flex:1; min-width:110px; border-radius:12px; padding:12px; text-align:center;}
  .stat-val{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:1.3rem;}
  .stat-lbl{font-size:11px; color:#3A4658; margin-top:2px;}

  .pctbar-row{margin-bottom:8px;}
  .pctbar-top{display:flex; justify-content:space-between; font-size:12px; margin-bottom:3px;}
  .pctbar-track{width:100%; height:8px; border-radius:5px; background:#EEF1F5; overflow:hidden;}
  .pctbar-fill{height:100%;}

  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .login-card{width:100%; max-width:380px; background:white; border-radius:16px; padding:26px; text-align:center; box-shadow:0 10px 30px rgba(11,37,69,.10);}
  .setup-card{width:100%; max-width:440px; background:white; border-radius:16px; padding:26px; box-shadow:0 10px 30px rgba(11,37,69,.10);}
  .lock-circle{width:48px; height:48px; border-radius:999px; background:var(--navy); display:flex; align-items:center; justify-content:center; margin:0 auto 12px;}

  .footer-note{text-align:center; font-size:12px; color:var(--gray); padding:10px 20px 30px;}
  .backup-row{display:flex; gap:8px; flex-wrap:wrap;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ CONSTANTS ============ */
const NAVY="#0B2545", RED="#E5383B", BLUE="#3E92CC", GRAY="#8D99AE", GOLD="#FFB703", GREEN="#2E8B57";
const DISCIPLINAS = ["SL","GS","SG","KR"];
const NIEVE = ["Hielo","Compacta","Polvo","Primavera"];
const CLIMA = ["Soleado","Nublado","Viento","Nevando","Niebla","Lluvia"];
const TRABAJO = [
  {label:"Didáctico", color:BLUE},
  {label:"Trazado de carrera", color:RED},
  {label:"Ejercicios educativos", color:GOLD},
  {label:"Esquí libre dirigido", color:GREEN},
];
const FUNDAMENTOS = ["Equilibrio","Control de canteo","Control de presión","Rotación","Gestión de línea"];
const CATEGORIAS = ["Semillero","U8","U10","U12","U14","U16"];

const K_AUTH = "ski-auth-session"; // per-device only (not synced): who is logged in on this browser

/* ============ SUPABASE CONNECTION ============ */
const SUPABASE_URL = "https://aezctpnbubzgpfskrool.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFlemN0cG5idWJ6Z3Bmc2tyb29sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5NzMzMDAsImV4cCI6MjA5OTU0OTMwMH0.OxvTZc1ZutUbNP7LYTMcxJj_yEum-DwIB3pHtGFX4_8";
const REST = SUPABASE_URL + "/rest/v1";

function sbHeaders(extra){
  return Object.assign({ "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" }, extra || {});
}
async function sbSelect(table, qs){
  const res = await fetch(`${REST}/${table}?${qs || "select=*"}`, { headers: sbHeaders() });
  if(!res.ok) throw new Error(`${table}: ${res.status} ${await res.text()}`);
  return res.json();
}
async function sbInsert(table, rowOrRows, opts={}){
  const params = opts.onConflict ? `?on_conflict=${opts.onConflict}` : "";
  const res = await fetch(`${REST}/${table}${params}`, {
    method: "POST",
    headers: sbHeaders({ "Prefer": (opts.merge ? "resolution=merge-duplicates," : "") + "return=representation" }),
    body: JSON.stringify(rowOrRows)
  });
  if(!res.ok) throw new Error(`${table} insert: ${res.status} ${await res.text()}`);
  const data = await res.json();
  return Array.isArray(rowOrRows) ? data : data[0];
}
async function sbUpdate(table, match, patch){
  const qs = Object.entries(match).map(([k,v]) => `${k}=eq.${encodeURIComponent(v)}`).join("&");
  const res = await fetch(`${REST}/${table}?${qs}`, { method: "PATCH", headers: sbHeaders({ "Prefer": "return=representation" }), body: JSON.stringify(patch) });
  if(!res.ok) throw new Error(`${table} update: ${res.status} ${await res.text()}`);
  const data = await res.json();
  return data[0];
}
async function sbDelete(table, match){
  const qs = Object.entries(match).map(([k,v]) => `${k}=eq.${encodeURIComponent(v)}`).join("&");
  const res = await fetch(`${REST}/${table}?${qs}`, { method: "DELETE", headers: sbHeaders() });
  if(!res.ok) throw new Error(`${table} delete: ${res.status} ${await res.text()}`);
}

/* ============ MAPPERS (DB snake_case -> app camelCase) ============ */
function mapAthlete(row){
  return { id: row.id, groupId: row.group_id, name: row.name, phone: row.phone || "",
    medical: { enfermedades: row.enfermedades || "", alergias: row.alergias || "", medicamentos: row.medicamentos || "", otros: row.otros || "" } };
}
function mapSession(row){
  return { id: row.id, groupId: row.group_id, date: row.date, sessionNumber: row.session_number,
    disciplina: row.disciplina, nieve: row.nieve, clima: row.clima, trabajo: row.trabajo,
    fundamentos: row.fundamentos || [], curvasPorBajada: row.curvas_por_bajada || 0, bajadas: row.bajadas || 0,
    totalCurvas: row.total_curvas || 0, notas: row.notas || "" };
}
function mapAttendance(row){
  return { id: row.id, athleteId: row.athlete_id, groupId: row.group_id, date: row.date, present: row.present };
}

function lsGet(key, fallback){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch(e){ return fallback; }
}
function lsSet(key, value){ try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){} }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function escapeHtml(str){ const d=document.createElement("div"); d.textContent = str==null? "": String(str); return d.innerHTML; }

function blankFicha(){ return {phone:"", enfermedades:"", alergias:"", medicamentos:"", otros:""}; }
function blankAccessConfig(){
  const categoryCodes = {};
  CATEGORIAS.forEach(c => categoryCodes[c] = "");
  return { masterCode:"", categoryCodes };
}
function blankSessionForm(){
  return { disciplina:null, nieve:null, clima:null, trabajo:null, fundamentos:[], curvasPorBajada:0, bajadas:0, notas:"" };
}

/* ============ STATE ============ */
let groups = [];
let athletes = [];
let sessions = [];
let attendance = [];
let accessConfig = null; // null = still loading
let authState = null; // null = locked

let tab = "setup";
let selectedGroupId = null;
let selectedDate = todayISO();
let attendanceState = {};
let sessionCount = 1;
let sessionState = {};
let profileAthleteId = null;
let expandedAthleteId = null;
let fichaDraft = blankFicha();
let setupDraft = blankAccessConfig();
let adminDraft = null;
let showAdminCodes = {};
let authError = "";
let pinInput = "";
let showPin = false;
let saveDayError = "";
let saving = false;
let justSaved = false;

function persistAuth(){ if(authState) lsSet(K_AUTH, authState); else localStorage.removeItem(K_AUTH); }

/* ============ DERIVED HELPERS ============ */
function groupAthletes(){ return athletes.filter(a => a.groupId === selectedGroupId); }
function ensureCategoryGroup(name){
  let g = groups.find(gr => gr.name === name);
  if(!g){
    g = { id: "tmp-" + uid(), name };
    groups.push(g);
    sbInsert("groups", {name}, {onConflict:"name", merge:true}).then(row => { g.id = row.id; }).catch(()=>{});
  }
  return g;
}

function athleteStats(athleteId, groupId){
  const attRecs = attendance.filter(a => a.athleteId === athleteId);
  const totalDays = attRecs.length;
  const presentDays = attRecs.filter(a => a.present).length;
  const attendancePct = totalDays ? Math.round(presentDays/totalDays*100) : 0;
  const presentDates = new Set(attRecs.filter(a=>a.present).map(a=>a.date));
  const credited = sessions.filter(s => s.groupId === groupId && presentDates.has(s.date));

  function pct(key, options){
    const total = credited.length;
    const counts = {};
    credited.forEach(s => { counts[s[key]] = (counts[s[key]]||0) + 1; });
    return options.map(o => ({name:o, value: total? Math.round(((counts[o]||0)/total)*100) : 0}));
  }
  const educativas = credited.filter(s => s.trabajo === "Ejercicios educativos");
  const fundamentosPct = FUNDAMENTOS.map(f => ({
    name:f,
    value: educativas.length? Math.round((educativas.filter(s => (s.fundamentos||[]).includes(f)).length / educativas.length)*100) : 0
  }));

  return {
    attendancePct, presentDays, totalDays,
    disciplina: pct("disciplina", DISCIPLINAS),
    nieve: pct("nieve", NIEVE),
    clima: pct("clima", CLIMA),
    trabajo: pct("trabajo", TRABAJO.map(t=>t.label)),
    fundamentos: fundamentosPct,
    educativasCount: educativas.length,
    totalCurvas: credited.reduce((sum,s)=>sum+(s.totalCurvas||0),0),
    totalSesiones: credited.length,
  };
}

/* ============ AUTH ACTIONS ============ */
async function handleFirstTimeSetup(){
  if(!setupDraft.masterCode.trim()){ authError = "Define un código para el jefe de entrenadores."; render(); return; }
  const missing = CATEGORIAS.filter(c => !setupDraft.categoryCodes[c] || !setupDraft.categoryCodes[c].trim());
  if(missing.length){ authError = "Falta definir el código de: " + missing.join(", ") + "."; render(); return; }
  authError = "";
  try{
    const row = await sbUpdate("access_config", {id:1}, {master_code: setupDraft.masterCode, category_codes: setupDraft.categoryCodes});
    accessConfig = { masterCode: row.master_code, categoryCodes: row.category_codes };
  }catch(e){ authError = "No se pudo guardar: " + e.message; render(); return; }
  authState = {level:"master"};
  persistAuth();
  render();
}
function handleLogin(){
  const code = pinInput.trim();
  if(!code){ authError = "Ingresa tu código de acceso."; render(); return; }
  if(code === accessConfig.masterCode){
    authState = {level:"master"}; persistAuth(); pinInput=""; authError=""; render(); return;
  }
  const cat = CATEGORIAS.find(c => accessConfig.categoryCodes[c] && accessConfig.categoryCodes[c] === code);
  if(cat){
    authState = {level:"category", category:cat}; persistAuth(); pinInput=""; authError="";
    const g = ensureCategoryGroup(cat);
    selectedGroupId = g.id;
    render(); return;
  }
  authError = "Código incorrecto.";
  render();
}
function handleLogout(){
  authState = null; persistAuth(); pinInput=""; tab="setup"; render();
}
function openAdmin(){ adminDraft = { masterCode: accessConfig.masterCode, categoryCodes: {...accessConfig.categoryCodes} }; render(); }
async function saveAdminCodes(){
  try{
    const row = await sbUpdate("access_config", {id:1}, {master_code: adminDraft.masterCode, category_codes: adminDraft.categoryCodes});
    accessConfig = { masterCode: row.master_code, categoryCodes: row.category_codes };
  }catch(e){ alert("No se pudo guardar los códigos: " + e.message); }
  adminDraft = null;
  render();
}

/* ============ GROUP / ATHLETE ACTIONS ============ */
function selectCategory(name){
  const g = ensureCategoryGroup(name);
  selectedGroupId = g.id;
  render();
}
async function removeGroup(id){
  try{ await sbDelete("groups", {id}); }catch(e){ alert("No se pudo eliminar en la base de datos: " + e.message); }
  groups = groups.filter(g => g.id !== id);
  athletes = athletes.filter(a => a.groupId !== id);
  sessions = sessions.filter(s => s.groupId !== id);
  attendance = attendance.filter(a => a.groupId !== id);
  if(selectedGroupId === id) selectedGroupId = groups[0] ? groups[0].id : null;
  render();
}
async function addAthlete(name, groupId){
  if(!name.trim() || !groupId) return;
  try{
    const row = await sbInsert("athletes", { group_id: groupId, name: name.trim(), phone:"", enfermedades:"", alergias:"", medicamentos:"", otros:"" });
    athletes.push(mapAthlete(row));
    render();
  }catch(e){ alert("No se pudo guardar el integrante: " + e.message); }
}
async function removeAthlete(id){
  try{ await sbDelete("athletes", {id}); }catch(e){ alert("No se pudo eliminar: " + e.message); }
  athletes = athletes.filter(a => a.id !== id);
  attendance = attendance.filter(a => a.athleteId !== id);
  render();
}
function toggleFicha(athlete){
  if(expandedAthleteId === athlete.id){ expandedAthleteId = null; render(); return; }
  expandedAthleteId = athlete.id;
  fichaDraft = {
    phone: athlete.phone || "",
    enfermedades: athlete.medical?.enfermedades || "",
    alergias: athlete.medical?.alergias || "",
    medicamentos: athlete.medical?.medicamentos || "",
    otros: athlete.medical?.otros || "",
  };
  render();
}
async function saveFicha(athleteId){
  try{
    const row = await sbUpdate("athletes", {id:athleteId}, {
      phone: fichaDraft.phone, enfermedades: fichaDraft.enfermedades, alergias: fichaDraft.alergias,
      medicamentos: fichaDraft.medicamentos, otros: fichaDraft.otros
    });
    athletes = athletes.map(a => a.id===athleteId ? mapAthlete(row) : a);
  }catch(e){ alert("No se pudo guardar la ficha: " + e.message); }
  expandedAthleteId = null;
  render();
}

/* ============ DAILY ENTRY ============ */
function initDailyForm(){
  if(!selectedGroupId) return;
  justSaved = false;
  const gAthletes = groupAthletes();
  attendanceState = {};
  gAthletes.forEach(a => {
    const rec = attendance.find(r => r.athleteId === a.id && r.date === selectedDate);
    attendanceState[a.id] = rec ? rec.present : true;
  });
  const daySessions = sessions.filter(s => s.groupId === selectedGroupId && s.date === selectedDate);
  sessionCount = daySessions.length ? Math.max(...daySessions.map(s=>s.sessionNumber)) : 1;
  sessionState = {};
  for(let i=1;i<=sessionCount;i++){
    const existing = daySessions.find(s => s.sessionNumber === i);
    sessionState[i] = existing ? {
      disciplina:existing.disciplina, nieve:existing.nieve, clima:existing.clima, trabajo:existing.trabajo,
      fundamentos: existing.fundamentos || [], curvasPorBajada:existing.curvasPorBajada, bajadas:existing.bajadas, notas:existing.notas
    } : blankSessionForm();
  }
}
function changeSessionCount(delta){
  const savedNums = sessions.filter(s=>s.groupId===selectedGroupId && s.date===selectedDate).map(s=>s.sessionNumber);
  const minCount = savedNums.length ? Math.max(...savedNums) : 1;
  let next = sessionCount + delta;
  if(next < minCount) next = minCount;
  if(next < 1) next = 1;
  if(next > sessionCount){ for(let i=sessionCount+1;i<=next;i++){ if(!sessionState[i]) sessionState[i] = blankSessionForm(); } }
  sessionCount = next;
  render();
}
async function saveDay(){
  saveDayError = "";
  justSaved = false;
  for(let i=1;i<=sessionCount;i++){
    const s = sessionState[i];
    if(!s || !s.disciplina || !s.nieve || !s.clima || !s.trabajo){
      saveDayError = `Completa disciplina, nieve, clima y trabajo realizado en la Sesión ${i} (o reduce el número de sesiones).`;
      render(); return;
    }
  }
  saving = true; render();

  try{
    const attRows = groupAthletes().map(a => ({ athlete_id: a.id, group_id: selectedGroupId, date: selectedDate, present: !!attendanceState[a.id] }));
    if(attRows.length){
      const savedAtt = await sbInsert("attendance", attRows, {onConflict:"athlete_id,date", merge:true});
      const savedAttArr = Array.isArray(savedAtt) ? savedAtt : [savedAtt];
      savedAttArr.forEach(row => {
        const mapped = mapAttendance(row);
        const idx = attendance.findIndex(x => x.athleteId===mapped.athleteId && x.date===mapped.date);
        if(idx>=0) attendance[idx]=mapped; else attendance.push(mapped);
      });
    }

    const sessRows = [];
    for(let i=1;i<=sessionCount;i++){
      const s = sessionState[i];
      const totalCurvas = (s.curvasPorBajada||0) * (s.bajadas||0);
      sessRows.push({
        group_id: selectedGroupId, date: selectedDate, session_number: i,
        disciplina: s.disciplina, nieve: s.nieve, clima: s.clima, trabajo: s.trabajo,
        fundamentos: s.trabajo==="Ejercicios educativos" ? (s.fundamentos||[]) : [],
        curvas_por_bajada: s.curvasPorBajada||0, bajadas: s.bajadas||0, total_curvas: totalCurvas,
        notas: (s.notas||"").trim()
      });
    }
    const savedSess = await sbInsert("sessions", sessRows, {onConflict:"group_id,date,session_number", merge:true});
    const savedSessArr = Array.isArray(savedSess) ? savedSess : [savedSess];
    savedSessArr.forEach(row => {
      const mapped = mapSession(row);
      const idx = sessions.findIndex(x => x.groupId===mapped.groupId && x.date===mapped.date && x.sessionNumber===mapped.sessionNumber);
      if(idx>=0) sessions[idx]=mapped; else sessions.push(mapped);
    });

    justSaved = true;
  }catch(e){
    saveDayError = `No se pudo guardar el día. Detalle: ${e.message}. Vuelve a intentarlo; si persiste, dime exactamente este texto.`;
  }
  saving = false;
  render();
}

/* ============ EXPORT ============ */
function buildDaySummaryText(){
  const group = groups.find(g => g.id === selectedGroupId);
  const gAthletes = groupAthletes();
  const present = gAthletes.filter(a => attendanceState[a.id]);
  const absent = gAthletes.filter(a => !attendanceState[a.id]);
  let text = `🎿 Entrenamiento ${group?.name||""} — ${selectedDate}\n\n`;
  text += `Asistencia: ${present.length}/${gAthletes.length} presentes\n`;
  if(present.length) text += `Presentes: ${present.map(a=>a.name).join(", ")}\n`;
  if(absent.length) text += `Ausentes: ${absent.map(a=>a.name).join(", ")}\n`;
  text += `\n`;
  for(let i=1;i<=sessionCount;i++){
    const s = sessionState[i];
    if(!s || !s.disciplina) continue;
    const total = (s.curvasPorBajada||0) * (s.bajadas||0);
    text += `— Sesión ${i} —\n`;
    text += `Disciplina: ${s.disciplina}\n`;
    text += `Tipo de nieve: ${s.nieve}\n`;
    text += `Clima: ${s.clima}\n`;
    text += `Trabajo realizado: ${s.trabajo}\n`;
    if(s.fundamentos && s.fundamentos.length) text += `Fundamentos: ${s.fundamentos.join(", ")}\n`;
    text += `Curvas por bajada: ${s.curvasPorBajada||0}\n`;
    text += `Cantidad de bajadas: ${s.bajadas||0}\n`;
    text += `Total de curvas: ${total}\n`;
    if(s.notas && s.notas.trim()) text += `Observaciones: ${s.notas.trim()}\n`;
    text += `\n`;
  }
  return text.trim();
}
function shareToWhatsApp(){
  const text = buildDaySummaryText();
  window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, "_blank");
}

function exportExcel(){
  const group = groups.find(g => g.id === selectedGroupId);
  const dates = Array.from(new Set(attendance.filter(r=>r.groupId===selectedGroupId).map(r=>r.date))).sort();
  const attSheet = [["Integrante", ...dates]];
  groupAthletes().forEach(a => {
    const row = [a.name];
    dates.forEach(d => { const rec = attendance.find(r=>r.athleteId===a.id && r.date===d); row.push(rec ? (rec.present?"Presente":"Ausente") : ""); });
    attSheet.push(row);
  });
  const summarySheet = [["Integrante","Teléfono","% Asistencia","Sesiones acreditadas","Total curvas","Disciplina más practicada","Trabajo más practicado","Fundamento más trabajado"]];
  groupAthletes().forEach(a => {
    const st = athleteStats(a.id, selectedGroupId);
    const topDisc = [...st.disciplina].sort((x,y)=>y.value-x.value)[0];
    const topTrab = [...st.trabajo].sort((x,y)=>y.value-x.value)[0];
    const topFund = [...st.fundamentos].sort((x,y)=>y.value-x.value)[0];
    summarySheet.push([a.name, a.phone||"—", st.attendancePct+"%", st.totalSesiones, st.totalCurvas,
      topDisc && topDisc.value>0 ? `${topDisc.name} (${topDisc.value}%)` : "—",
      topTrab && topTrab.value>0 ? `${topTrab.name} (${topTrab.value}%)` : "—",
      topFund && topFund.value>0 ? `${topFund.name} (${topFund.value}%)` : "—"]);
  });
  const fichaSheet = [["Integrante","Teléfono","Enfermedades relevantes","Alergias","Medicamentos permanentes","Otros"]];
  groupAthletes().forEach(a => {
    const m = a.medical || blankFicha();
    fichaSheet.push([a.name, a.phone||"—", m.enfermedades||"—", m.alergias||"—", m.medicamentos||"—", m.otros||"—"]);
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(attSheet), "Asistencia");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summarySheet), "Resumen por integrante");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(fichaSheet), "Fichas médicas");
  XLSX.writeFile(wb, `entrenamiento_${(group?.name||"grupo").replace(/\s+/g,"_")}_${todayISO()}.xlsx`);
}
function copySummary(){
  const group = groups.find(g => g.id === selectedGroupId);
  let text = `Resumen — ${group?.name||""} (al ${todayISO()})\n\n`;
  groupAthletes().forEach(a => {
    const st = athleteStats(a.id, selectedGroupId);
    text += `• ${a.name}: ${st.attendancePct}% asistencia, ${st.totalSesiones} sesiones, ${st.totalCurvas} curvas totales\n`;
  });
  navigator.clipboard.writeText(text).then(()=>{ alert("Resumen copiado al portapapeles."); });
}
function exportBackupJSON(){
  const backup = {groups, athletes, sessions, attendance, accessConfig, exportedAt: new Date().toISOString()};
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `respaldo_esqui_${todayISO()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

        <div class="total-box"><span class="lbl">Total de curvas</span><span class="val" id="total-${i}">${total}</span></div>

        <textarea class="notas-input" data-session="${i}" rows="2" placeholder="Observaciones de la sesión...">${escapeHtml(s.notas)}</textarea>
      </div>`;
    }

    if(saveDayError) html += `<div class="error-box">${escapeHtml(saveDayError)}</div>`;
    html += `<button class="save-btn" id="save-day-btn">${saving? "Guardando...":"✓ Guardar día"}</button>`;
    if(justSaved){
      html += `<button class="save-btn" id="share-whatsapp-btn" style="background:${GREEN};margin-top:10px;">📲 Compartir a WhatsApp</button>`;
    }
    html += `</div>`;

    html += `<div class="card">
      <div class="backup-row">
        <button class="btn-navy" id="export-excel-btn" style="flex:1;">⬇️ Descargar Excel</button>
        <button class="btn-outline" id="copy-summary-btn" style="flex:1;">📋 Copiar resumen</button>
      </div>
    </div>`;
  }

  return html;
}

function renderProfileTab(){
  let html = `<div class="card">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">`;
  if(authState.level === "master"){
    html += `<select id="profile-group-select">${groups.map(g => `<option value="${g.id}" ${g.id===selectedGroupId?"selected":""}>${escapeHtml(g.name)}</option>`).join("")}</select>`;
  }
  const gAthletes = groupAthletes();
  html += `<select id="profile-athlete-select">${gAthletes.map(a => `<option value="${a.id}" ${a.id===profileAthleteId?"selected":""}>${escapeHtml(a.name)}</option>`).join("")}</select>`;
  html += `</div>`;

  const profileAthlete = athletes.find(a => a.id === profileAthleteId);
  if(!profileAthlete){
    html += `<div style="text-align:center;font-size:13px;color:${GRAY};padding:24px 0;">Agrega integrantes a este grupo para ver su perfil.</div></div>`;
    return html;
  }

  const st = athleteStats(profileAthleteId, selectedGroupId);
  const m = profileAthlete.medical || blankFicha();

  html += `<div style="background:#F7FAFC;border:1px solid #E7ECF2;border-radius:12px;padding:14px;margin-bottom:16px;">
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;">
      <span style="font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:11px;color:${NAVY};letter-spacing:.05em;">🩺 Ficha del integrante</span>
    </div>
    <div style="font-size:13px;margin-bottom:6px;">📞 ${profileAthlete.phone ? escapeHtml(profileAthlete.phone) : `<span style="color:${GRAY};">Sin teléfono registrado</span>`}</div>
    <div style="font-size:12px;display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;">
      <div><b>Enfermedades:</b> ${escapeHtml(m.enfermedades)||"—"}</div>
      <div><b>Alergias:</b> ${escapeHtml(m.alergias)||"—"}</div>
      <div><b>Medicamentos:</b> ${escapeHtml(m.medicamentos)||"—"}</div>
      <div><b>Otros:</b> ${escapeHtml(m.otros)||"—"}</div>
    </div>
    <div style="font-size:11px;color:${GRAY};margin-top:8px;">Para editar estos datos, ve a la pestaña "Grupos".</div>
  </div>`;

  html += `<div class="stat-row">
    <div class="stat-box" style="background:#EAF7EE;"><div class="stat-val" style="color:${GREEN};">${st.attendancePct}%</div><div class="stat-lbl">Asistencia (${st.presentDays}/${st.totalDays})</div></div>
    <div class="stat-box" style="background:#EEF3FA;"><div class="stat-val" style="color:${NAVY};">${st.totalSesiones}</div><div class="stat-lbl">Sesiones acreditadas</div></div>
    <div class="stat-box" style="background:#FFF6E0;"><div class="stat-val" style="color:#B87700;">${st.totalCurvas}</div><div class="stat-lbl">Curvas totales a la fecha</div></div>
  </div>`;

  html += variableBlockHTML("Disciplina", st.disciplina, () => NAVY);
  html += variableBlockHTML("Tipo de nieve", st.nieve, () => BLUE);
  html += variableBlockHTML("Clima", st.clima, () => GOLD);
  html += variableBlockHTML("Trabajo realizado", st.trabajo, (name) => (TRABAJO.find(t=>t.label===name)||{}).color || NAVY);

  if(st.educativasCount > 0){
    html += variableBlockHTML("Fundamentos (en ejercicios educativos)", st.fundamentos, () => GOLD);
    html += `<div style="font-size:11px;color:${GRAY};margin-bottom:10px;">% de las ${st.educativasCount} sesiones de ejercicios educativos en que se trabajó cada fundamento (pueden sumar más de 100%).</div>`;
  }

  html += `<div style="font-size:11px;color:${GRAY};">Los porcentajes se calculan solo con los días en que este integrante estuvo presente.</div>`;
  html += `</div>`;
  return html;
}

function renderAccessTab(){
  let html = `<div class="card">
    <div class="section-label"><div class="gate-poles"><span></span><span></span></div><span class="title">Códigos de acceso</span></div>
    <div style="font-size:12px;color:${GRAY};margin-bottom:16px;">Comparte cada código solo con el entrenador de esa categoría.</div>`;

  if(!adminDraft){
    html += `<button class="btn-navy" id="open-admin-btn">🔑 Ver y editar códigos</button>`;
  } else {
    html += `<label class="field-label">Código del jefe de entrenadores</label>
      <div style="position:relative;margin-bottom:14px;">
        <input type="${showAdminCodes.master?"text":"password"}" id="admin-master-code" value="${escapeHtml(adminDraft.masterCode)}" style="font-family:'JetBrains Mono',monospace;" />
      </div>
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:${GRAY};margin-bottom:12px;">
        <input type="checkbox" id="admin-master-show" ${showAdminCodes.master?"checked":""}/> Mostrar código del jefe
      </label>
      <div style="font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:11px;color:${NAVY};letter-spacing:.05em;margin-bottom:8px;">Código por categoría</div>`;
    CATEGORIAS.forEach(c => {
      html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
        <span style="font-size:13px;width:50px;flex-shrink:0;">${c}</span>
        <input type="${showAdminCodes[c]?"text":"password"}" class="admin-cat-code" data-cat="${c}" value="${escapeHtml(adminDraft.categoryCodes[c]||"")}" style="font-family:'JetBrains Mono',monospace;flex:1;" />
        <label style="font-size:11px;color:${GRAY};display:flex;align-items:center;gap:3px;"><input type="checkbox" class="admin-cat-show" data-cat="${c}" ${showAdminCodes[c]?"checked":""}/> ver</label>
      </div>`;
    });
    html += `<div style="display:flex;gap:8px;margin-top:12px;">
      <button class="save-btn" id="save-admin-codes-btn" style="flex:1;">✓ Guardar códigos</button>
      <button class="btn-outline" id="cancel-admin-btn">Cancelar</button>
    </div>`;
  }
  html += `</div>`;

  html += `<div class="card">
    <div class="section-label"><div class="gate-poles"><span></span><span></span></div><span class="title">Respaldo de datos</span></div>
    <div style="font-size:12px;color:${GRAY};margin-bottom:14px;">Los datos ya se sincronizan solos entre todos los dispositivos a través de la base de datos — no necesitas hacer nada para eso. Este respaldo es solo una copia extra por si acaso.</div>
    <div class="backup-row">
      <button class="btn-navy" id="export-backup-btn" style="flex:1;">⬇️ Descargar copia (.json)</button>
    </div>
  </div>`;
  return html;
}

/* ============ MAIN RENDER DISPATCHER ============ */
function render(){
  const app = document.getElementById("app");
  if(accessConfig === null){
    app.innerHTML = renderFirstTimeSetup();
    attachSetupScreenHandlers();
    return;
  }
  if(!authState){
    app.innerHTML = renderLogin();
    attachLoginScreenHandlers();
    return;
  }
  if(authState.level === "category" && !selectedGroupId){
    const g = ensureCategoryGroup(authState.category);
    selectedGroupId = g.id;
  }
  if(tab === "daily" || tab === "profile"){
    // keep forms in sync lazily; only (re)initialize when needed by caller
  }
  let body = "";
  if(tab === "setup") body = renderSetupTab();
  else if(tab === "daily") body = renderDailyTab();
  else if(tab === "profile") body = renderProfileTab();
  else if(tab === "access" && authState.level === "master") body = renderAccessTab();
  else { tab = "setup"; body = renderSetupTab(); }

  app.innerHTML = renderHeader() + `<div class="wrap">${body}</div>
    <div class="footer-note">Los datos se guardan solo en este navegador y este dispositivo.</div>`;
  attachAppHandlers();
}

/* ============ EVENT HANDLERS ============ */
function attachSetupScreenHandlers(){
  document.getElementById("setup-master").addEventListener("input", (e) => { setupDraft.masterCode = e.target.value; });
  document.querySelectorAll(".setup-cat-code").forEach(inp => {
    inp.addEventListener("input", (e) => { setupDraft.categoryCodes[inp.dataset.cat] = e.target.value; });
  });
  document.getElementById("setup-save-btn").addEventListener("click", handleFirstTimeSetup);
}
function attachLoginScreenHandlers(){
  const pin = document.getElementById("pin-input");
  pin.addEventListener("input", (e) => { pinInput = e.target.value; });
  pin.addEventListener("keydown", (e) => { if(e.key === "Enter") handleLogin(); });
  document.getElementById("show-pin-check").addEventListener("change", (e) => { showPin = e.target.checked; render(); pin.focus(); });
  document.getElementById("login-btn").addEventListener("click", handleLogin);
}

function attachAppHandlers(){
  const logoutBtn = document.getElementById("logout-btn");
  if(logoutBtn) logoutBtn.addEventListener("click", handleLogout);
  const refreshBtn = document.getElementById("refresh-btn");
  if(refreshBtn) refreshBtn.addEventListener("click", manualRefresh);

  document.querySelectorAll("[data-tab]").forEach(btn => {
    btn.addEventListener("click", () => {
      tab = btn.dataset.tab;
      if(tab === "daily") initDailyForm();
      if(tab === "profile" && !profileAthleteId){
        const list = groupAthletes();
        if(list.length) profileAthleteId = list[0].id;
      }
      render();
    });
  });

  if(tab === "setup") attachSetupTabHandlers();
  if(tab === "daily") attachDailyTabHandlers();
  if(tab === "profile") attachProfileTabHandlers();
  if(tab === "access") attachAccessTabHandlers();
}

function attachSetupTabHandlers(){
  document.querySelectorAll("[data-cat]").forEach(btn => {
    if(btn.dataset.cat && btn.classList.contains("cat-btn")){
      btn.addEventListener("click", (e) => { if(e.target.closest("[data-remove-group]")) return; selectCategory(btn.dataset.cat); });
    }
  });
  document.querySelectorAll("[data-remove-group]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const id = el.dataset.removeGroup;
      const group = groups.find(g => g.id === id);
      const name = group ? group.name : "esta categoría";
      if(confirm(`¿Eliminar la categoría ${name}? Se borrarán también todos sus integrantes, sesiones y asistencia. Esta acción no se puede deshacer.`)){
        removeGroup(id);
      }
    });
  });
  const addBtn = document.getElementById("add-athlete-btn");
  if(addBtn){
    addBtn.addEventListener("click", () => {
      const nameInput = document.getElementById("new-athlete-name");
      addAthlete(nameInput.value, selectedGroupId);
    });
  }
  document.querySelectorAll("[data-toggle-ficha]").forEach(btn => {
    btn.addEventListener("click", () => {
      const athlete = athletes.find(a => a.id === btn.dataset.toggleFicha);
      toggleFicha(athlete);
    });
  });
  document.querySelectorAll("[data-remove-athlete]").forEach(el => {
    el.addEventListener("click", () => {
      const id = el.dataset.removeAthlete;
      const athlete = athletes.find(a => a.id === id);
      const name = athlete ? athlete.name : "este integrante";
      if(confirm(`¿Eliminar a ${name}? Esta acción no se puede deshacer.`)){
        removeAthlete(id);
      }
    });
  });
  const savedFichaBtn = document.getElementById("save-ficha-btn");
  if(savedFichaBtn){
    ["ficha-phone","ficha-enfermedades","ficha-alergias","ficha-medicamentos","ficha-otros"].forEach(id => {
      const el = document.getElementById(id);
      if(el) el.addEventListener("input", (e) => {
        const field = id.replace("ficha-","");
        fichaDraft[field] = e.target.value;
      });
    });
    savedFichaBtn.addEventListener("click", () => saveFicha(savedFichaBtn.dataset.athlete));
  }
}

function attachDailyTabHandlers(){
  const groupSelect = document.getElementById("daily-group-select");
  if(groupSelect) groupSelect.addEventListener("change", (e) => { selectedGroupId = e.target.value; initDailyForm(); render(); });
  const dateInput = document.getElementById("daily-date-input");
  if(dateInput) dateInput.addEventListener("change", (e) => { selectedDate = e.target.value; initDailyForm(); render(); });

  document.querySelectorAll("[data-att]").forEach(btn => {
    btn.addEventListener("click", () => {
      attendanceState[btn.dataset.att] = btn.dataset.present === "true";
      render();
    });
  });

  const decBtn = document.getElementById("dec-session-btn");
  if(decBtn) decBtn.addEventListener("click", () => changeSessionCount(-1));
  const incBtn = document.getElementById("inc-session-btn");
  if(incBtn) incBtn.addEventListener("click", () => changeSessionCount(1));

  document.querySelectorAll(".pills[data-session]").forEach(container => {
    const i = parseInt(container.dataset.session);
    const group = container.dataset.pillgroup;
    container.querySelectorAll(".pill").forEach(btn => {
      btn.addEventListener("click", () => {
        if(group === "fundamentos"){
          const val = btn.dataset.fund;
          const cur = sessionState[i].fundamentos || [];
          sessionState[i].fundamentos = cur.includes(val) ? cur.filter(f=>f!==val) : [...cur, val];
        } else {
          const val = btn.dataset.value;
          sessionState[i][group] = sessionState[i][group] === val ? null : val;
        }
        render();
      });
    });
  });

  document.querySelectorAll(".num-input").forEach(inp => {
    inp.addEventListener("input", () => {
      const i = parseInt(inp.dataset.session);
      const target = inp.dataset.target;
      let v = parseInt(inp.value.replace(/[^0-9]/g,""));
      if(isNaN(v) || v < 0) v = 0;
      sessionState[i][target] = v;
      const total = (sessionState[i].curvasPorBajada||0) * (sessionState[i].bajadas||0);
      const totalEl = document.getElementById(`total-${i}`);
      if(totalEl) totalEl.textContent = total;
    });
  });
  document.querySelectorAll("[data-delta]").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = parseInt(btn.dataset.session);
      const target = btn.dataset.target;
      const delta = parseInt(btn.dataset.delta);
      const newVal = Math.max(0, (sessionState[i][target]||0) + delta);
      sessionState[i][target] = newVal;
      const input = document.querySelector(`.num-input[data-session="${i}"][data-target="${target}"]`);
      if(input) input.value = newVal;
      const total = (sessionState[i].curvasPorBajada||0) * (sessionState[i].bajadas||0);
      const totalEl = document.getElementById(`total-${i}`);
      if(totalEl) totalEl.textContent = total;
    });
  });
  document.querySelectorAll(".notas-input").forEach(t => {
    t.addEventListener("input", (e) => { sessionState[parseInt(t.dataset.session)].notas = e.target.value; });
  });

  const saveDayBtn = document.getElementById("save-day-btn");
  if(saveDayBtn) saveDayBtn.addEventListener("click", saveDay);
  const shareBtn = document.getElementById("share-whatsapp-btn");
  if(shareBtn) shareBtn.addEventListener("click", shareToWhatsApp);
  const exportBtn = document.getElementById("export-excel-btn");
  if(exportBtn) exportBtn.addEventListener("click", exportExcel);
  const copyBtn = document.getElementById("copy-summary-btn");
  if(copyBtn) copyBtn.addEventListener("click", copySummary);
}

function attachProfileTabHandlers(){
  const groupSelect = document.getElementById("profile-group-select");
  if(groupSelect) groupSelect.addEventListener("change", (e) => {
    selectedGroupId = e.target.value;
    profileAthleteId = null;
    const list = groupAthletes();
    if(list.length) profileAthleteId = list[0].id;
    render();
  });
  const athleteSelect = document.getElementById("profile-athlete-select");
  if(athleteSelect) athleteSelect.addEventListener("change", (e) => { profileAthleteId = e.target.value; render(); });
}

function attachAccessTabHandlers(){
  const openBtn = document.getElementById("open-admin-btn");
  if(openBtn) openBtn.addEventListener("click", openAdmin);
  const masterInput = document.getElementById("admin-master-code");
  if(masterInput) masterInput.addEventListener("input", (e) => { adminDraft.masterCode = e.target.value; });
  const masterShow = document.getElementById("admin-master-show");
  if(masterShow) masterShow.addEventListener("change", (e) => { showAdminCodes.master = e.target.checked; render(); });
  document.querySelectorAll(".admin-cat-code").forEach(inp => {
    inp.addEventListener("input", (e) => { adminDraft.categoryCodes[inp.dataset.cat] = e.target.value; });
  });
  document.querySelectorAll(".admin-cat-show").forEach(chk => {
    chk.addEventListener("change", (e) => { showAdminCodes[chk.dataset.cat] = e.target.checked; render(); });
  });
  const saveBtn = document.getElementById("save-admin-codes-btn");
  if(saveBtn) saveBtn.addEventListener("click", saveAdminCodes);
  const cancelBtn = document.getElementById("cancel-admin-btn");
  if(cancelBtn) cancelBtn.addEventListener("click", () => { adminDraft = null; render(); });

  const exportBackupBtn = document.getElementById("export-backup-btn");
  if(exportBackupBtn) exportBackupBtn.addEventListener("click", exportBackupJSON);
}

/* ============ INIT ============ */
function showLoadingScreen(msg){
  document.getElementById("app").innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:${GRAY};font-size:14px;text-align:center;padding:20px;">${msg || "Cargando sistema..."}</div>`;
}
function showFatalError(message){
  document.getElementById("app").innerHTML = `<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;color:${RED};font-size:14px;gap:12px;">
    <div>No se pudo conectar con la base de datos.<br>Detalle: ${escapeHtml(message)}</div>
    <button onclick="location.reload()" style="padding:8px 16px;border-radius:8px;border:1px solid ${RED};background:white;color:${RED};cursor:pointer;">Reintentar</button>
  </div>`;
}

async function loadAllData(){
  const [gRows, aRows, sRows, atRows, acRows] = await Promise.all([
    sbSelect("groups"), sbSelect("athletes"), sbSelect("sessions"), sbSelect("attendance"), sbSelect("access_config")
  ]);
  groups = gRows.map(r => ({id:r.id, name:r.name}));
  athletes = aRows.map(mapAthlete);
  sessions = sRows.map(mapSession);
  attendance = atRows.map(mapAttendance);
  if(acRows && acRows[0]) accessConfig = { masterCode: acRows[0].master_code, categoryCodes: acRows[0].category_codes };
}

async function init(){
  showLoadingScreen();
  try{
    await loadAllData();
  }catch(e){
    showFatalError(e.message);
    return;
  }

  authState = lsGet(K_AUTH, null);

  if(authState && authState.level === "category"){
    const g = ensureCategoryGroup(authState.category);
    selectedGroupId = g.id;
  } else if(groups[0]){
    selectedGroupId = groups[0].id;
  }
  if(authState){
    if(tab === "daily") initDailyForm();
    const list = groupAthletes();
    if(list.length) profileAthleteId = list[0].id;
  }
  render();
}

let refreshing = false;
let lastSync = null;
async function manualRefresh(){
  refreshing = true; render();
  try{
    await loadAllData();
    lastSync = new Date();
  }catch(e){
    alert("No se pudo actualizar: " + e.message);
  }
  refreshing = false;
  render();
}

init();
</script>
